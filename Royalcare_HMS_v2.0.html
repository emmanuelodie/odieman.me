<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royalcare — Hospital Management System</title>
<style>
:root{
  --bg:#F6F9FA; --surface:#FFFFFF; --ink:#16323B; --muted:#5B7480; --faint:#8AA0AA;
  --line:#E4EBEE; --line2:#EEF3F5;
  --teal:#0E9F8E; --teal-deep:#0B7C70; --teal-tint:#E6F6F3; --teal-tint2:#F1FAF8;
  --amber:#E08A1E; --amber-tint:#FBF1E0; --red:#D94A4A; --red-tint:#FBECEC; --green:#1FA971;
  --shadow:0 1px 2px rgba(16,50,59,.04),0 4px 16px rgba(16,50,59,.06);
  --shadow-lg:0 8px 30px rgba(16,50,59,.12);
  --r:12px; --r-sm:8px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--teal-deep)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:20px 20px 14px;display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(14,159,142,.3)}
.logo svg{width:20px;height:20px}
.brand-name{font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand-name span{color:var(--teal)}
.brand-sub{font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.nav{padding:8px 12px;flex:1}
.nav-label{font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;padding:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;margin-bottom:2px;transition:.15s}
.nav a:hover{background:var(--teal-tint2);color:var(--ink)}
.nav a.on{background:var(--teal-tint);color:var(--teal-deep)}
.nav a .ic{width:18px;height:18px;flex-shrink:0;opacity:.9}
.nav a .badge{margin-left:auto;background:var(--line);color:var(--muted);font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px}
.nav a.on .badge{background:var(--teal);color:#fff}
.side-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.6}
.side-foot b{color:var(--muted);font-weight:700}

.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{height:62px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:18px;flex-shrink:0}
.topbar h1{font-size:18px}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--muted);font-size:13px}
.active-chip{display:flex;align-items:center;gap:9px;background:var(--teal-tint);color:var(--teal-deep);padding:6px 12px;border-radius:30px;font-weight:700;font-size:13px}
.active-chip .x{cursor:pointer;opacity:.6;font-weight:800}
.active-chip .x:hover{opacity:1}
.content{flex:1;overflow-y:auto;padding:24px}
.view{display:none;animation:fade .2s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px}
.card-head h2{font-size:15px}
.card-head .sub{color:var(--muted);font-size:12.5px;font-weight:500}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.right{text-align:right}
.center{text-align:center}

label.fld{display:block;margin-bottom:12px}
label.fld .lab{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint)}
input::placeholder{color:var(--faint)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--faint);background:var(--line2)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-deep);border-color:var(--teal-deep)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--teal-deep)}
.btn.ghost:hover{background:var(--teal-tint)}
.btn.danger{color:var(--red);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--red-tint)}
.btn:disabled{opacity:.5;cursor:not-allowed}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--teal-tint2)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:30px;font-size:11.5px;font-weight:700}
.pill.wait{background:var(--amber-tint);color:var(--amber)}
.pill.done{background:var(--teal-tint);color:var(--teal-deep)}
.pill.paid{background:#E8F6EF;color:var(--green)}
.pill.due{background:var(--red-tint);color:var(--red)}
.pill.dept{background:var(--line2);color:var(--muted)}

.stat{padding:18px 20px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.stat .v small{font-size:14px;color:var(--faint);font-weight:600}

.empty{padding:40px 20px;text-align:center;color:var(--faint)}
.empty .big{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:4px}

/* patient journey stepper — the signature element */
.journey{display:flex;align-items:center;gap:0;padding:16px 20px;overflow-x:auto}
.jstep{display:flex;align-items:center;gap:0;flex-shrink:0}
.jdot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:84px}
.jdot .circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2px solid var(--line);background:var(--surface);color:var(--faint)}
.jdot.done .circle{background:var(--teal);border-color:var(--teal);color:#fff}
.jdot.now .circle{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 0 0 4px var(--amber-tint)}
.jdot .lbl{font-size:11px;font-weight:700;color:var(--muted);text-align:center;max-width:90px}
.jdot.now .lbl{color:var(--amber)}
.jdot.done .lbl{color:var(--teal-deep)}
.jline{height:2px;width:34px;background:var(--line);flex-shrink:0;margin-top:-18px}
.jline.done{background:var(--teal)}

.kanban{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:560px}
.col-head{padding:13px 15px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.col-head .cnt{margin-left:auto;background:var(--line2);color:var(--muted);font-size:11px;padding:1px 8px;border-radius:20px;font-weight:700}
.col-body{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.qcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;background:var(--surface);transition:.15s}
.qcard:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.qcard .name{font-weight:700;font-size:13.5px}
.qcard .svc{color:var(--muted);font-size:12px;margin-top:2px}
.qcard .acts{display:flex;gap:6px;margin-top:9px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(16,50,59,.4);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:50;overflow-y:auto}
.scrim.on{display:flex}
.modal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);width:100%;max-width:520px;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center}
.modal-head h2{font-size:16px}
.modal-head .x{margin-left:auto;cursor:pointer;color:var(--faint);font-size:22px;line-height:1}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line2);display:flex;gap:10px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.receipt{font-family:var(--sans);max-width:320px}
.receipt h3{text-align:center}
.receipt .line{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.receipt .tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-weight:800}

@media print{
  .side,.topbar,.no-print{display:none!important}
  .app{display:block;height:auto}
  .content{padding:0}
}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:40;width:248px;height:100%;transform:translateX(-100%);transition:.2s}
  .side.open{transform:none}
  .g2,.g3{grid-template-columns:1fr}
}

/* login */
.login{position:fixed;inset:0;background:linear-gradient(135deg,#0E9F8E,#0B7C70);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.login.hidden{display:none}
.login-card{background:#fff;border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.28);padding:30px 28px;width:100%;max-width:360px}
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.subtab{padding:8px 14px;border-radius:30px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.subtab:hover{border-color:var(--faint)}
.subtab.on{background:var(--teal);border-color:var(--teal);color:#fff}
.flag-hi{color:var(--red)} .flag-lo{color:var(--amber)} .flag-ok{color:var(--green)}
.lowrow td{background:var(--red-tint)}
.userpill{background:var(--teal-tint);color:var(--teal-deep);padding:5px 12px;border-radius:30px;font-weight:700;font-size:12.5px}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="login-card">
    <div class="brand" style="justify-content:center;padding:0 0 4px">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-9.5-9C1 9 2.5 5 6.5 5 9 5 12 8 12 8s3-3 5.5-3C21.5 5 23 9 21.5 12 19 16.5 12 21 12 21Z" fill="#fff"/><path d="M7 12h2l1.5-3 2 5 1.5-2H17" stroke="#0E9F8E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><div class="brand-name">Royal<span>care</span></div><div class="brand-sub">Hospital Management System</div></div>
    </div>
    <p class="muted center" style="margin:6px 0 18px">Sign in to your workspace</p>
    <label class="fld"><span class="lab">Username</span><input id="lg-user" autocomplete="off"></label>
    <label class="fld"><span class="lab">Passcode</span><input id="lg-pass" type="password" onkeydown="if(event.key==='Enter')doLogin()"></label>
    <div id="lg-err" style="color:var(--red);font-size:13px;min-height:18px;margin:2px 0 6px"></div>
    <button class="btn primary" style="width:100%;justify-content:center" onclick="doLogin()">Sign in</button>
    <div class="faint center" style="font-size:11px;margin-top:14px">Each role opens its own workspace.</div>
  </div>
</div>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-9.5-9C1 9 2.5 5 6.5 5 9 5 12 8 12 8s3-3 5.5-3C21.5 5 23 9 21.5 12 19 16.5 12 21 12 21Z" fill="#fff" opacity=".95"/><path d="M7 12h2l1.5-3 2 5 1.5-2H17" stroke="#0E9F8E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div>
        <div class="brand-name">Royal<span>care</span></div>
        <div class="brand-sub">Hospital Management</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <b>Royalcare</b> · v2.0 Hospital Edition<br>
      Developed by Emmanuel Odie · Odieman Suite<br>
      emmanuelodie94@gmail.com
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="btn sm no-print" style="display:none" id="menuBtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>

      <div class="top-meta">
        <span id="activePatient"></span>
        <span id="todayDate"></span>
        <span id="userChip"></span>
      </div>
    </header>
    <div class="content">
      <section id="v-dashboard" class="view on"></section>
      <section id="v-reception" class="view"></section>
      <section id="v-queue" class="view"></section>
      <section id="v-billing" class="view"></section>
      <section id="v-patients" class="view"></section>
      <section id="v-services" class="view"></section>
      <section id="v-settings" class="view"></section>
      <section id="v-doctor" class="view"></section>
      <section id="v-wards" class="view"></section>
      <section id="v-nursing" class="view"></section>
      <section id="v-theatre" class="view"></section>
      <section id="v-lab" class="view"></section>
      <section id="v-pharmacy" class="view"></section>
      <section id="v-dental" class="view"></section>
      <section id="v-ultrasound" class="view"></section>
      <section id="v-xray" class="view"></section>
      <section id="v-users" class="view"></section>
      <section id="v-docadvisory" class="view"></section>
      <section id="v-adminfin" class="view"></section>
      <section id="v-about" class="view"></section>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>

function load(){
  let v=null; try{const p=JSON.parse(localStorage.getItem(KEY)); if(p&&p.clinic)v=p;}catch(e){}
  if(!v){ try{const lp=JSON.parse(localStorage.getItem(LEGACY_KEY)); if(lp&&lp.clinic)v=lp;}catch(e){} }
  if(!v) v=seed();
  if(!v.users||!v.users.length){ v.users=defaultUsers(); } else if(v.users.length<=1){ defaultUsers().forEach(du=>{ if(!v.users.some(x=>(x.username||"").toLowerCase()===du.username.toLowerCase())) v.users.push(du); }); }
  if(!v.users.some(x=>x.role==="nurse")){ v.users.push({id:uid(),username:"nurse",name:"Nurse Test",role:"nurse",passcode:"nurse"}); }
  if(!v.labCatalog)v.labCatalog=seed().labCatalog; if(!v.labStock)v.labStock=seed().labStock;
  if(!v.drugs)v.drugs=seed().drugs; if(!v.interactions)v.interactions=seed().interactions; if(!v.stock)v.stock=seed().stock;
  if(!v.departments.includes("X-ray"))v.departments.push("X-ray");
  if(!v.departments.includes("Wards"))v.departments.push("Wards");
  if(!v.batches)v.batches=[]; if(!v.ledger)v.ledger=[];
  ensureOpeningBatches(v); recomputeStock(v);
  if(!v.labBatches)v.labBatches=[]; if(!v.labLedger)v.labLedger=[];
  if(!v.finance)v.finance={salaries:{},rent:0,utilities:0,statutory:0,other:[]};
  if(!v.genLedger)v.genLedger=[];
  if(!v.wards||!v.wards.length)v.wards=seedWards();
  v.wards.forEach(w=>{ if(!w.beds)w.beds=[]; if(w.bedRate==null)w.bedRate=15000; });
  if(!v.admissions)v.admissions=[];
  v.admissions.forEach(a=>{ if(!a.vitals)a.vitals=[]; if(!a.marEntries)a.marEntries=[]; if(!a.nursingNotes)a.nursingNotes=[]; if(!a.transfers)a.transfers=[]; if(!a.chargedDates)a.chargedDates=[]; if(a.clerking===undefined)a.clerking=null; if(!a.progressNotes)a.progressNotes=[]; if(!a.icdCodes)a.icdCodes=[]; });
  if(v.admSeq==null)v.admSeq=0;
  if(!v.departments.includes("Theatre"))v.departments.push("Theatre");
  if(!v.theatres||!v.theatres.length)v.theatres=seedTheatres();
  if(!v.surgeries)v.surgeries=[];
  if(v.surgSeq==null)v.surgSeq=0;
  if(!v.insurers||!v.insurers.length)v.insurers=["NHIF","CHF / iCHF","Jubilee Insurance","AAR Insurance Tanzania","Strategis Insurance","Britam Tanzania","Resolution Insurance Tanzania","MO Assurance","GA Insurance Tanzania"];
  if(!v.suppliers)v.suppliers=[];
  if(!v.purchases)v.purchases=[];
  if(!v.supplierPayments)v.supplierPayments=[];
  if(!v.tillSessions)v.tillSessions=[];
  if(!v.icd10||!v.icd10.length)v.icd10=seedIcd10();
  v.patients.forEach(p=>{ if(!p.medications)p.medications=[]; if(p.allergies==null)p.allergies=""; });
  if(!v.coverageRules)v.coverageRules={};
  if(v.labSeq==null)v.labSeq=0;
  if(v.payerNotes==null)v.payerNotes="";
  ensureLabOpeningBatches(v); recomputeLabStock(v);
  return v;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){ if(!SERVER_MODE)alert("Could not save — storage may be full. Export a backup."); }
  if(SERVER_MODE) scheduleSync();
  refreshChrome();
}
function sigOf(db){ try{return (db.patients?db.patients.length:0)+":"+(db.visits?db.visits.length:0)+":"+(db.payments?db.payments.length:0)+":"+JSON.stringify(db).length;}catch(e){return "";} }
function applyServerDB(db,rerender){ if(!db||!db.clinic)return; DB=db; _lastSig=sigOf(db); try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){} if(rerender)maybeRerender(); refreshChrome(); }
function maybeRerender(){ if($("#scrim")&&$("#scrim").classList.contains("on"))return; const ae=document.activeElement; if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return; if(currentUser&&typeof CUR!=="undefined")go(CUR); }
function scheduleSync(){ clearTimeout(_syncTimer); _syncTimer=setTimeout(syncPush,500); }
async function syncPush(){ try{ const r=await fetch(API+"/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(DB)}); const merged=await r.json(); applyServerDB(merged,true); }catch(e){} }
async function syncPull(){ if($("#scrim")&&$("#scrim").classList.contains("on"))return; try{ const r=await fetch(API+"/api/db"); const db=await r.json(); if(db&&db.clinic){ const s=sigOf(db); if(s!==_lastSig) applyServerDB(db,true); } }catch(e){} }
function startPolling(){ if(!SERVER_MODE)return; clearInterval(_pollTimer); _pollTimer=setInterval(syncPull,4000); }

function money(n){ n=Number(n)||0; return (DB.clinic.currency||"TZS")+" "+n.toLocaleString("en-US"); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function modal(html){ $("#modal").innerHTML=html; $("#scrim").classList.add("on"); }
function closeModal(){ $("#scrim").classList.remove("on"); }
$("#scrim").addEventListener("click",e=>{ if(e.target===$("#scrim"))closeModal(); });

function patient(id){ return DB.patients.find(p=>p.id===id); }
function editAllergiesModal(pid){
  const p=patient(pid); if(!p)return;
  modal(`<div class="modal-head"><h2>Allergies — ${esc(p.name)}</h2><span class="x" onclick="closeModal()">×</span></div>
  <div class="modal-body">
    <label class="fld"><span class="lab">Known drug/other allergies</span><input id="al-text" value="${esc(p.allergies||"")}" placeholder="e.g. Penicillin, Sulfa drugs — or 'None known'"></label>
    <div class="muted" style="font-size:12px">This is shown at consultation, admission and prescribing to help catch unsafe orders early.</div>
  </div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAllergies('${pid}')">Save</button></div>`);
}
function saveAllergies(pid){
  const p=patient(pid); if(!p)return;
  p.allergies=$("#al-text").value.trim(); save(); closeModal(); patientProfile(pid); toast("Allergies updated");
}
function openVisit(pid){ return DB.visits.find(v=>v.patientId===pid && v.status==="open"); }
function unpaidSteps(pid){ const out=[]; DB.visits.filter(v=>v.patientId===pid).forEach(v=>v.steps.forEach(s=>{ if(s.price>0 && !s.paid) out.push({v,s}); })); return out; }
function isClaimPayer(p){ return !!(p && (p.type==="NHIF"||p.type==="CHF / iCHF"||p.type==="Insurance")); }
function chargePrice(pid,cash,ins){ const p=patient(pid); const c=Number(cash)||0; if(isClaimPayer(p) && ins!==undefined && ins!==null && ins!==""){ const n=Number(ins); if(!isNaN(n)) return n; } return c; }
function payerLabel(p){ if(!p||!p.type||p.type==="Cash")return""; if(p.type==="Insurance") return p.insurer||"Insurance"; return p.type; }
function payerBadge(p){ if(!p||!p.type||p.type==="Cash"||p.type==="Staff") return p&&p.type==="Staff"?` <span class="pill dept">Staff</span>`:""; const cls=p.type==="NHIF"?"wait":p.type==="CHF / iCHF"?"dept":"due"; const label=esc(payerLabel(p)); const tip=p.memberNo?(' title="Member/Card no.: '+esc(p.memberNo)+'"'):""; return ` <span class="pill ${cls}"${tip}>${label}</span>`; }

function buildNav(){
  const open=openVisitCount(); let out="";
  for(let i=0;i<NAV.length;i++){
    const n=NAV[i];
    if(n.sec){ let has=false; for(let j=i+1;j<NAV.length&&!NAV[j].sec;j++){ if(canSee(NAV[j].k)){has=true;break;} } if(has)out+=`<div class="nav-label">${n.sec}</div>`; continue; }
    if(!canSee(n.k)) continue;
    const sv=n.stroke?`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${n.ic}</svg>`:`<svg class="ic" viewBox="0 0 24 24" fill="currentColor">${n.ic}</svg>`;
    const badge=n.k==="queue"&&open?`<span class="badge">${open}</span>`:(n.k==="wards"&&activeAdmissionCount()?`<span class="badge">${activeAdmissionCount()}</span>`:(n.k==="theatre"&&surgeriesTodayCount()?`<span class="badge">${surgeriesTodayCount()}</span>`:""));
    out+=`<a href="#" data-k="${n.k}" onclick="go('${n.k}');return false">${sv}<span>${n.t}</span>${badge}</a>`;
  }
  $("#nav").innerHTML=out; markNav();
}
function markNav(){ document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===CUR)); }

function journeyHTML(v){
  if(!v||!v.steps.length) return `<div class="muted" style="padding:0 20px 4px;font-size:12.5px">No services added yet — channel this patient to a department.</div>`;
  let h="";
  v.steps.forEach((s,i)=>{
    const cls=s.status==="done"?"done":(i===v.steps.findIndex(x=>x.status==="waiting")?"now":"");
    h+=`<div class="jstep"><div class="jdot ${cls}"><div class="circle">${s.status==="done"?"✓":i+1}</div><div class="lbl">${esc(s.dept)}<br><span style="font-weight:500;color:var(--faint)">${esc(s.serviceName)}</span></div></div>`;
    if(i<v.steps.length-1) h+=`<div class="jline ${s.status==="done"?"done":""}"></div>`;
    h+=`</div>`;
  });
  return `<div class="journey">${h}</div>`;
}

function queueReports(){
  const openVisits=DB.visits.filter(v=>v.status==="open");
  const waitingByDept={}; openVisits.forEach(v=>v.steps.forEach(s=>{ if(s.status==="waiting") waitingByDept[s.dept]=(waitingByDept[s.dept]||0)+1; }));
  const maxW=Math.max(1,...Object.values(waitingByDept));
  // wait time = now - step.at for waiting steps; turnaround = doneAt - step.at for done steps
  const waits=[]; openVisits.forEach(v=>v.steps.forEach(s=>{ if(s.status==="waiting"&&s.at) waits.push((Date.now()-new Date(s.at))/60000); }));
  const avgWait=waits.length?Math.round(waits.reduce((a,b)=>a+b,0)/waits.length):null;
  const tats=[]; DB.visits.forEach(v=>v.steps.forEach(s=>{ if(s.status==="done"&&s.at) {} }));
  const totalWaitingNow=Object.values(waitingByDept).reduce((a,b)=>a+b,0);
  const closedToday=DB.visits.filter(v=>v.status==="closed"&&(v.closedAt||"").slice(0,10)===todayStr()).length;
  $("#q-body").innerHTML=`
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card stat"><div class="k">Open visits (active episodes)</div><div class="v">${openVisits.length}</div></div>
    <div class="card stat"><div class="k">Patients waiting right now</div><div class="v">${totalWaitingNow}</div></div>

}

function completeStep(vid,sid){ const v=DB.visits.find(x=>x.id===vid); if(!v)return; const s=v.steps.find(x=>x.id===sid); if(s)s.status="done"; save(); renderQueue(); }

    </div></div>
  </div>`;
}
function takePayment(pid){
  const items=unpaidSteps(pid); if(!items.length)return;
  const total=items.reduce((a,x)=>a+x.s.price,0);
  const method=$("#pay-method")?$("#pay-method").value:"Cash";
  const isClaim=method==="NHIF claim"||method==="CHF/iCHF claim"||method==="Insurance claim";
  const p=patient(pid);
  let copay=0, claim=null;
  if(isClaim){
    const payerName=method==="NHIF claim"?"NHIF":method==="CHF/iCHF claim"?"CHF / iCHF":(p&&p.insurer)||"Insurance";
    const rule=coverageRuleFor(payerName);
    if(rule){
      if(rule.exclusions&&rule.exclusions.length){
        const excludedDepts=[...new Set(items.filter(x=>rule.exclusions.some(e=>e.toLowerCase()===x.s.dept.toLowerCase())).map(x=>x.s.dept))];
        if(excludedDepts.length){
          if(!confirm(payerName+" typically excludes: "+excludedDepts.join(", ")+". These charges may not be reimbursed. Continue billing as a claim anyway?")) return;
        }
      }
      const claimRefEl=$("#pay-claimref"); const claimRef=claimRefEl?claimRefEl.value.trim():"";
      if(rule.preAuthThreshold!=null && total>rule.preAuthThreshold && !claimRef){
        alert("This claim ("+money(total)+") exceeds "+payerName+"'s pre-authorisation threshold of "+money(rule.preAuthThreshold)+". Enter a pre-authorisation/claim reference before continuing.");
        return;
      }
      if(rule.annualLimit!=null){
        const usedSoFar=claimsThisYearFor(pid,payerName);
        const copayNow=Math.max(0,Math.min(total,Number($("#pay-copay")?$("#pay-copay").value:0)||0));
        const wouldClaim=total-copayNow;
        if(usedSoFar+wouldClaim>rule.annualLimit){
          if(!confirm((p?p.name:"This patient")+" has used "+money(usedSoFar)+" of "+payerName+"'s "+money(rule.annualLimit)+" annual limit. This claim would exceed it by "+money((usedSoFar+wouldClaim)-rule.annualLimit)+". Continue anyway (the excess may be rejected)?")) return;
        }
      }
    }
    copay=Math.max(0,Math.min(total,Number($("#pay-copay")?$("#pay-copay").value:0)||0));
    claim={status:"Pending",ref:$("#pay-claimref")?$("#pay-claimref").value.trim():"",memberNo:$("#pay-memberno")?$("#pay-memberno").value.trim():"",amount:total-copay,submittedAt:null,settledAt:null};
  } else { copay=total; }
  items.forEach(x=>{ x.s.paid=true; });
  const pay={id:uid(),patientId:pid,at:now(),method,total,cashCollected:copay,ref:"RC-"+Date.now().toString().slice(-6),
    payer:{type:p?p.type:"Cash",insurer:p?p.insurer:"",memberNo:(claim&&claim.memberNo)||(p?p.memberNo:"")},
    claim,
    items:items.map(x=>({serviceName:x.s.serviceName,dept:x.s.dept,price:x.s.price}))};
  DB.payments.push(pay); save();
  renderBilling(); refreshChrome();
  showReceipt(pay.id);
}
function showReceipt(payId){

  modal(`<div class="modal-head"><h2>Payment received</h2><span class="x" onclick="closeModal()">×</span></div>
  <div class="modal-body"><div class="receipt" id="rcpt">
    <h3>${esc(DB.clinic.name)}</h3>

/* ---------------- PATIENT CASCADE REPORT ---------------- */
function patientCascadeReport(){
  const visits=DB.visits;
  const total=visits.length;
  const hasDept=(v,d)=>v.steps.some(s=>s.dept===d);
  const doneDept=(v,d)=>v.steps.some(s=>s.dept===d&&s.status==="done");
  const consulted=visits.filter(v=>hasDept(v,"Consultation"));
  const consultDone=visits.filter(v=>doneDept(v,"Consultation"));
  const referred=visits.filter(v=>v.steps.some(s=>s.dept!=="Consultation"));
  const referredDone=visits.filter(v=>v.steps.some(s=>s.dept!=="Consultation"&&s.status==="done"));
  const fullyPaid=visits.filter(v=>v.steps.every(s=>s.price<=0||s.paid));
  const closed=visits.filter(v=>v.status==="closed");
  const stages=[
    ["Visit started",total],
    ["Reached consultation",consulted.length],
    ["Consultation completed",consultDone.length],
    ["Referred onward (lab/pharmacy/etc.)",referred.length],
    ["Onward step completed",referredDone.length],
    ["Bill fully settled",fullyPaid.length],
    ["Visit closed (episode complete)",closed.length]
  ];
  const base=total||1;
  const deptRows=DB.departments.map(d=>{
    const reach=visits.filter(v=>hasDept(v,d)).length;
    const done=visits.filter(v=>doneDept(v,d)).length;
    return {d,reach,done};
  });
  const maxReach=Math.max(1,...deptRows.map(r=>r.reach));
  const patients=[...DB.patients].sort((a,b)=>a.name.localeCompare(b.name));

  $("#pt-body").innerHTML=`
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card stat"><div class="k">Patients registered</div><div class="v">${DB.patients.length}</div></div>
    <div class="card stat"><div class="k">Visits (episodes of care)</div><div class="v">${total}</div></div>
    <div class="card stat"><div class="k">Episodes fully closed</div><div class="v">${closed.length} <small>(${total?Math.round(closed.length/base*100):0}%)</small></div></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><h2>Patient cascade — population funnel</h2><span class="sub">Where patients drop off across the care pathway</span></div>
    <div class="card-pad">
      ${total?stages.map(([label,c],i)=>{
        const pct=Math.round(c/base*100);
        const prev=i>0?stages[i-1][1]:c;
        const drop=i>0?(prev-c):0;
        return `<div style="margin-bottom:12px">
          <div class="row" style="margin-bottom:4px"><b style="font-size:13px">${esc(label)}</b><span class="spacer"></span><b>${c}</b><span class="muted" style="margin-left:6px;font-size:12px">(${pct}%)</span></div>
          <div style="height:12px;background:var(--line2);border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--teal);border-radius:6px"></div></div>
          ${i>0&&drop>0?`<div class="muted" style="font-size:11.5px;margin-top:3px">↓ ${drop} dropped off vs. previous stage</div>`:""}
        </div>`;
      }).join(""):`<div class="empty"><div class="big">No visits yet</div>Register a patient and start a visit to see the cascade.</div>`}
    </div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><h2>Reach by department</h2><span class="sub">Visits touching each department, and how many were completed there</span></div>
    <div class="card-pad">
      ${deptRows.map(r=>`<div class="row" style="margin-bottom:10px">
        <div style="width:170px;font-weight:600;font-size:13px">${esc(r.d)}</div>
        <div style="flex:1;height:10px;background:var(--line2);border-radius:6px;overflow:hidden"><div style="height:100%;width:${Math.round(r.reach/maxReach*100)}%;background:var(--teal);border-radius:6px"></div></div>
        <b style="width:34px;text-align:right">${r.reach}</b>
        <span class="muted" style="width:90px;text-align:right;font-size:12px">${r.reach?Math.round(r.done/r.reach*100):0}% done</span>
      </div>`).join("")}
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Single patient journey</h2><span class="sub">Drill into one patient's full path through the clinic</span></div>
    <div class="card-pad">
      <label class="fld"><span class="lab">Choose a patient</span>
        <select id="cascade-pt-select" onchange="cascadePid=this.value;patientCascadeReport()">
          <option value="">— select —</option>
          ${patients.map(p=>`<option value="${p.id}" ${cascadePid===p.id?'selected':''}>${esc(p.name)} (${esc(p.regNo)})</option>`).join("")}
        </select>
      </label>
      <div id="cascade-detail" style="margin-top:10px">${cascadePid?patientCascadeDetailHTML(cascadePid):`<div class="muted">Pick a patient above to see their full cascade — every department they passed through, with timing and cost.</div>`}</div>
    </div>
  </div>`;
}

/* ---------------- ICD-10 DIAGNOSIS PICKER ---------------- */
function icd10Search(q){ q=(q||"").trim().toLowerCase(); if(!q)return []; return DB.icd10.filter(c=>c.code.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)).slice(0,20); }
let _icdSlots={};
function icdSetSlot(slot,arr){ _icdSlots[slot]=(arr||[]).map(c=>({code:c.code,desc:c.desc})); }
function icdPickerHTML(slot){
  return `<div class="icd-picker">
    <input id="icd-input-${slot}" placeholder="Search ICD-10 — e.g. malaria, J18, hypertension" oninput="icdSearchInput('${slot}',this.value)">
    <div id="icd-results-${slot}"></div>
    <div id="icd-chips-${slot}" style="margin-top:6px">${icdChipsHTML(slot)}</div>
  </div>`;
}
function icdChipsHTML(slot){
  const sel=_icdSlots[slot]||[];
  return sel.length?sel.map((c,i)=>`<span class="pill dept" style="margin:2px 4px 2px 0;cursor:pointer" onclick="icdRemove('${slot}',${i})" title="Click to remove">${esc(c.code)} — ${esc(c.desc)} ✕</span>`).join(""):`<span class="muted" style="font-size:12px">No diagnosis codes added yet.</span>`;
}
function icdSearchInput(slot,q){
  const results=icd10Search(q); const el=$("#icd-results-"+slot); if(!el)return;
  el.innerHTML = q.trim()? (results.length? `<div style="border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:180px;overflow:auto">${results.map(c=>`<div style="padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line2);font-size:13px" onclick="icdAdd('${slot}','${c.code}')">${esc(c.code)} — ${esc(c.desc)}</div>`).join("")}</div>` : `<div class="muted" style="font-size:12px;margin-top:4px">No matches — an administrator can add custom codes in Settings.</div>`) : "";
}
function icdAdd(slot,code){
  const c=DB.icd10.find(x=>x.code===code); if(!c)return;
  if(!_icdSlots[slot])_icdSlots[slot]=[];
  if(!_icdSlots[slot].some(x=>x.code===code)) _icdSlots[slot].push({code:c.code,desc:c.desc});
  const chipsEl=$("#icd-chips-"+slot); if(chipsEl)chipsEl.innerHTML=icdChipsHTML(slot);
  const resEl=$("#icd-results-"+slot); if(resEl)resEl.innerHTML="";
  const inputEl=$("#icd-input-"+slot); if(inputEl)inputEl.value="";
}
function icdRemove(slot,i){
  if(!_icdSlots[slot])return; _icdSlots[slot].splice(i,1);
  const chipsEl=$("#icd-chips-"+slot); if(chipsEl)chipsEl.innerHTML=icdChipsHTML(slot);
}

/* ---------------- WARDS & ADMISSIONS ---------------- */
function wardById(id){ return (DB.wards||[]).find(w=>w.id===id); }
function activeAdmissionForPatient(pid){ return (DB.admissions||[]).find(a=>a.patientId===pid&&a.status==="admitted"); }
function activeAdmissionCount(){ return (DB.admissions||[]).filter(a=>a.status==="admitted").length; }
function bedStats(){
  let total=0,occupied=0,vacant=0,cleaning=0,maint=0;
  (DB.wards||[]).forEach(w=>w.beds.forEach(b=>{ total++; if(b.status==="occupied")occupied++; else if(b.status==="vacant")vacant++; else if(b.status==="cleaning")cleaning++; else maint++; }));
  return {total,occupied,vacant,cleaning,maint};

function postDueBedCharges(){
  const t=todayStr(); let any=false;
  (DB.admissions||[]).forEach(adm=>{
    if(adm.status!=="admitted")return;
    const w=wardById(adm.wardId); if(!w)return;
    const v=DB.visits.find(x=>x.id===adm.visitId); if(!v)return;
    if(!adm.chargedDates)adm.chargedDates=[];
    let d=new Date(adm.admittedAt); d.setHours(0,0,0,0);
    const end=new Date(t+"T00:00:00");
    let guard=0;
    while(d<=end && guard<3660){
      const ds=d.toISOString().slice(0,10);
      if(!adm.chargedDates.includes(ds)){
        const price=chargePrice(adm.patientId,w.bedRate,w.bedRateIns);
        v.steps.push({id:uid(),dept:"Wards",serviceId:null,serviceName:w.name+" bed charge — "+ds,price,status:"done",paid:price>0?false:true,at:ds+"T12:00:00.000Z",wardCharge:true,admissionId:adm.id});
        adm.chargedDates.push(ds); any=true;
      }
      d.setDate(d.getDate()+1); guard++;
    }
  });
  if(any) save();
}

function saveWard(id){
  const name=$("#wd-name").value.trim(); if(!name){alert("Enter a ward name.");return;}
  const type=$("#wd-type").value.trim(); const rate=Number($("#wd-rate").value)||0;
  const rateInsRaw=$("#wd-rateins").value.trim(); const rateIns=rateInsRaw===""?null:(Number(rateInsRaw)||0);
  if(id){ Object.assign(wardById(id),{name,type,bedRate:rate,bedRateIns:rateIns}); }
  else { const n=Math.max(0,Number($("#wd-beds").value)||0); DB.wards.push({id:uid(),name,type,bedRate:rate,bedRateIns:rateIns,beds:mkBeds((name.slice(0,3)||"WD").toUpperCase(),n)}); }
  save(); closeModal(); renderWardSetup(); toast("Ward saved");
}
function delWard(id){
  const w=wardById(id); if(!w)return;
  if(w.beds.some(b=>b.status==="occupied")){ alert("This ward has occupied beds. Discharge or transfer those patients first."); return; }
  if(!confirm('Remove ward "'+w.name+'"? This cannot be undone.')) return;
  DB.wards=DB.wards.filter(x=>x.id!==id); save(); renderWardSetup();
}
function addBed(wardId){
  const w=wardById(wardId); if(!w)return;
  const suggestion=(w.name.slice(0,3)||"WD").toUpperCase()+"-"+String(w.beds.length+1).padStart(2,"0");
  const label=prompt("Bed label:",suggestion); if(!label)return;
  w.beds.push({id:uid(),label:label.trim(),status:"vacant"}); save(); renderWardSetup();
}
function delBed(wardId,bedId){
  const w=wardById(wardId); const b=w&&w.beds.find(x=>x.id===bedId); if(!b)return;
  if(b.status==="occupied"){alert("Cannot remove an occupied bed.");return;}
  if(!confirm("Remove bed "+b.label+"?"))return;
  w.beds=w.beds.filter(x=>x.id!==bedId); save(); renderWardSetup();
}
function setBedStatus(wardId,bedId,status){
  const w=wardById(wardId); const b=w&&w.beds.find(x=>x.id===bedId); if(!b)return;
  if(b.status==="occupied"){alert("This bed is occupied — discharge or transfer the patient first.");return;}
  b.status=status; save(); renderWardSetup();
}

  const v=DB.visits.find(x=>x.id===adm.visitId); if(!v)return [];

  return meds;
}

  const meds=medsForAdmission(adm).slice().reverse(); const seen={}; const out=[];

  return out;
}

function addRecoveryVitals(sid){
  const surg=DB.surgeries.find(s=>s.id===sid); if(!surg)return;
  if(!surg.recovery)surg.recovery={vitals:[],notes:[]};
  const entry={id:uid(),at:now(),pulse:$("#rc-pulse").value.trim(),bp:$("#rc-bp").value.trim(),spo2:$("#rc-spo2").value.trim(),pain:$("#rc-pain").value.trim()};
  if(!entry.pulse&&!entry.bp&&!entry.spo2&&!entry.pain){alert("Enter at least one value.");return;}
  surg.recovery.vitals.push(entry); save(); surgeryModal(sid,'recovery'); toast("Vitals recorded");
}
function addRecoveryNote(sid){
  const surg=DB.surgeries.find(s=>s.id===sid); if(!surg)return;
  const text=$("#rc-note").value.trim(); if(!text){alert("Write a note first.");return;}
  if(!surg.recovery)surg.recovery={vitals:[],notes:[]};
  surg.recovery.notes.push({id:uid(),note:text,at:now(),by:currentUser?currentUser.name:""});
  save(); surgeryModal(sid,'recovery'); toast("Note added");
}
function startSurgery(sid){
  const surg=DB.surgeries.find(s=>s.id===sid); if(!surg)return;
  if(!(surg.consent&&surg.consent.signed) && !confirm("Consent has not been recorded yet. Start anyway?")) return;
  if(!(surg.signIn&&surg.signIn.done) && !confirm("Sign In checklist is not complete. Start anyway?")) return;
  surg.status="In theatre";
  if(!surg.intraOp)surg.intraOp={};
  surg.intraOp.startAt=now();
  const th=theatreById(surg.theatreId); if(th)th.status="in-use";
  save(); surgeryModal(sid,'timeOut'); refreshChrome(); toast("Surgery started");
}
function sendToRecovery(sid){
  const surg=DB.surgeries.find(s=>s.id===sid); if(!surg)return;
  if(!(surg.signOut&&surg.signOut.done) && !confirm("Sign Out checklist is not complete. Continue anyway?")) return;
  surg.status="Recovery";
  if(!surg.intraOp)surg.intraOp={};
  surg.intraOp.endAt=now();
  save(); surgeryModal(sid,'recovery'); refreshChrome(); toast("Sent to recovery");
}
function completeSurgery(sid){
  const surg=DB.surgeries.find(s=>s.id===sid); if(!surg)return;
  surg.status="Completed"; surg.completedAt=now();
  const th=theatreById(surg.theatreId); if(th)th.status="cleaning";
  if(surg.serviceId){
    const svc=DB.services.find(x=>x.id===surg.serviceId);
    if(svc){
      let v=openVisit(surg.patientId); if(!v){ v={id:uid(),patientId:surg.patientId,createdAt:now(),status:"open",steps:[]}; DB.visits.push(v); }
      const price=chargePrice(surg.patientId,svc.price,svc.priceIns);
      v.steps.push({id:uid(),dept:"Theatre",serviceId:svc.id,serviceName:svc.name+" (Theatre fee)",price,status:"done",paid:price>0?false:true,at:now(),surgeryId:surg.id});
    }
  }
  save(); closeModal(); renderTheatre(); refreshChrome(); toast("Surgery completed");
}
function cancelSurgery(sid){
  const surg=DB.surgeries.find(s=>s.id===sid); if(!surg)return;
  const reason=prompt("Reason for cancelling this surgery:"); if(reason===null)return;
  surg.status="Cancelled"; surg.cancelReason=reason;
  const th=theatreById(surg.theatreId); if(th&&th.status==="in-use")th.status="available";
  save(); closeModal(); renderTheatre(); refreshChrome(); toast("Surgery cancelled");
}

function servicesReports(){
  const usage={},revenue={};
  DB.visits.forEach(v=>v.steps.forEach(s=>{usage[s.serviceName]=(usage[s.serviceName]||0)+1;}));
  DB.payments.forEach(p=>p.items.forEach(i=>{revenue[i.serviceName]=(revenue[i.serviceName]||0)+i.price;}));
  const rows=DB.services.map(s=>({s,uses:usage[s.name]||0,rev:revenue[s.name]||0}));
  const byUses=[...rows].sort((a,b)=>b.uses-a.uses);
  const maxUses=Math.max(1,...byUses.map(r=>r.uses));
  const activeCount=DB.services.filter(s=>s.active).length;
  const unused=rows.filter(r=>r.uses===0).length;
  $("#svc-body").innerHTML=`
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card stat"><div class="k">Active services</div><div class="v">${activeCount}</div></div>
    <div class="card stat"><div class="k">Total in catalog</div><div class="v">${DB.services.length}</div></div>
    <div class="card stat"><div class="k">Never ordered</div><div class="v">${unused}</div></div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Service usage & revenue</h2><span class="sub">How often each service is ordered, and what it has earned</span></div>
    <div class="card-pad" style="padding:6px 0">
      ${byUses.length?`<table><thead><tr><th>Service</th><th>Department</th><th class="right">Times ordered</th><th class="right">Revenue collected</th></tr></thead><tbody>
      ${byUses.map(r=>`<tr><td><b>${esc(r.s.name)}</b> ${r.s.active?"":'<span class="pill due">hidden</span>'}</td><td class="muted">${esc(r.s.dept)}</td>
        <td class="right"><div class="row" style="justify-content:flex-end;gap:8px"><div style="width:80px;height:8px;background:var(--line2);border-radius:6px;overflow:hidden"><div style="height:100%;width:${Math.round(r.uses/maxUses*100)}%;background:var(--teal);border-radius:6px"></div></div><b>${r.uses}</b></div></td>
        <td class="right"><b>${money(r.rev)}</b></td></tr>`).join("")}
      </tbody></table>`:`<div class="empty"><div class="big">No services yet</div></div>`}
    </div>
  </div>`;
}

  const s=id?DB.services.find(x=>x.id===id):null;

function saveService(id){
  const name=$("#s-name").value.trim(); if(!name){alert("Enter a service name.");return;}
  const insRaw=$("#s-priceins").value.trim(); const priceIns=insRaw===""?null:(Number(insRaw)||0);
  const rec={dept:$("#s-dept").value,name,price:Number($("#s-price").value)||0,priceIns,barcode:$("#s-barcode").value.trim(),active:$("#s-active").checked};
  if(id){ Object.assign(DB.services.find(x=>x.id===id),rec); } else { DB.services.push({id:uid(),...rec}); }
  save(); closeModal(); renderServices(); toast("Service saved");
}
function delService(id){ if(!confirm("Remove this service from the catalog?"))return; DB.services=DB.services.filter(x=>x.id!==id); save(); renderServices(); }

function saveClinic(){ DB.clinic.name=$("#c-name").value.trim()||"Royalcare Hospital"; DB.clinic.address=$("#c-addr").value.trim(); DB.clinic.phone=$("#c-phone").value.trim(); DB.clinic.currency=$("#c-cur").value.trim()||"TZS"; save(); renderSettings(); toast("Saved"); }
function addDept(){ const d=$("#new-dept").value.trim(); if(!d)return; if(DB.departments.includes(d)){alert("Already exists.");return;} DB.departments.push(d); save(); renderSettings(); }
function delDept(i){ const d=DB.departments[i]; if(DB.services.some(s=>s.dept===d)){alert("Remove or reassign this department's services first.");return;} if(!confirm("Remove "+d+"?"))return; DB.departments.splice(i,1); save(); renderSettings(); }
function addInsurer(){ const n=$("#new-insurer").value.trim(); if(!n)return; if(DB.insurers.some(x=>x.toLowerCase()===n.toLowerCase())){alert("Already in the list.");return;} DB.insurers.push(n); save(); renderSettings(); toast("Insurer added"); }
function addIcdCode(){
  const code=$("#new-icd-code").value.trim(); const desc=$("#new-icd-desc").value.trim();
  if(!code||!desc){alert("Enter both a code and a description.");return;}
  if(DB.icd10.some(c=>c.code.toLowerCase()===code.toLowerCase())){alert("That code is already in the list.");return;}

function bmiText(weight,height){
  const w=Number(weight),h=Number(height);
  if(!w||!h) return "";
  const bmi=w/((h/100)*(h/100));

  return "BMI "+bmi.toFixed(1)+" ("+cat+")";
}

/* ================= LABORATORY MODULE ================= */
function labTests(){ return DB.labCatalog||[]; }
function findLabTest(name){ const n=(""+name).trim().toLowerCase(); return labTests().find(t=>t.name.toLowerCase()===n)||null; }
function flagOf(a,val){
  if(val===""||val==null) return "";
  if(a.refLow!=null&&a.refHigh!=null&&!isNaN(Number(val))){ const n=Number(val); return n<a.refLow?"Low":n>a.refHigh?"High":"Normal"; }
  if(a.refText) return (""+val).trim().toLowerCase()===(""+a.refText).trim().toLowerCase()?"Normal":"Check";
  return "";
}
function flagClass(f){ return f==="High"?"flag-hi":f==="Low"?"flag-lo":f==="Check"?"flag-hi":f==="Normal"?"flag-ok":""; }
function lowStock(){ return (DB.labStock||[]).filter(s=>Number(s.qty)<=Number(s.reorder)); }
/* ============= LAB REAGENT BATCH + LEDGER FOUNDATION ============= */
function labItemBatches(id){ return (DB.labBatches||[]).filter(b=>b.itemId===id); }
function labOnHandBatches(id){ return labItemBatches(id).filter(b=>Number(b.qtyOnHand)>0).sort((a,b)=>{const ax=a.expiry||"9999-99",bx=b.expiry||"9999-99";return ax<bx?-1:ax>bx?1:(new Date(a.receivedAt||0)-new Date(b.receivedAt||0));}); }
function recomputeLabStock(db){ db=db||DB; (db.labStock||[]).forEach(s=>{ const bs=(db.labBatches||[]).filter(b=>b.itemId===s.id); s.qty=bs.reduce((a,b)=>a+(Number(b.qtyOnHand)||0),0); const ex=bs.filter(b=>(Number(b.qtyOnHand)||0)>0&&b.expiry).map(b=>b.expiry).sort(); s.expiry=ex[0]||""; }); }
function ensureLabOpeningBatches(db){ if(!db.labBatches)db.labBatches=[]; if(!db.labLedger)db.labLedger=[]; (db.labStock||[]).forEach(s=>{ const has=db.labBatches.some(b=>b.itemId===s.id); if(!has&&Number(s.qty)>0){ const b={id:uid(),itemId:s.id,batchNo:"OPENING",expiry:s.expiry||"",qtyReceived:Number(s.qty),qtyOnHand:Number(s.qty),cost:(s.cost!=null?s.cost:null),receivedAt:now(),by:"system"}; db.labBatches.push(b); db.labLedger.push({id:uid(),itemId:s.id,batchId:b.id,type:"opening",qty:Number(s.qty),ref:"Opening balance",at:now(),by:"system"}); } }); }
function labLedgerAdd(e){ if(!DB.labLedger)DB.labLedger=[]; DB.labLedger.push(Object.assign({id:uid(),at:now(),by:currentUser?currentUser.name:""},e)); }
function labReceive(itemId,batchNo,qty,expiry,cost,note){ qty=Number(qty)||0; if(qty<=0)return; const b={id:uid(),itemId,batchNo:((batchNo||"-")+"").trim()||"-",expiry:((expiry||"")+"").trim(),qtyReceived:qty,qtyOnHand:qty,cost:(cost===""||cost==null?null:Number(cost)),receivedAt:now(),by:currentUser?currentUser.name:""}; DB.labBatches.push(b); labLedgerAdd({itemId,batchId:b.id,type:"receive",qty:qty,ref:"Received",note:note||""}); recomputeLabStock(); }
function labConsumeFEFO(itemId,qty,ref){ let need=Number(qty)||0; labOnHandBatches(itemId).forEach(b=>{ if(need<=0)return; const take=Math.min(need,Number(b.qtyOnHand)); b.qtyOnHand=Number(b.qtyOnHand)-take; need-=take; labLedgerAdd({itemId,batchId:b.id,type:"issue",qty:-take,ref:ref||"Issued"}); }); recomputeLabStock(); return qty-need; }
function labAdjustBatch(batchId,delta,reason){ const b=(DB.labBatches||[]).find(x=>x.id===batchId); if(!b)return; const nd=Math.max(0,Number(b.qtyOnHand)+delta); const applied=nd-Number(b.qtyOnHand); b.qtyOnHand=nd; labLedgerAdd({itemId:b.itemId,batchId,type:(reason==="expired"?"expire":"adjust"),qty:applied,ref:reason||"Adjustment"}); recomputeLabStock(); }
function labItem(id){ return (DB.labStock||[]).find(s=>s.id===id); }

function labReceiveModal(id){ const s=labItem(id); if(!s)return;
  modal(`<div class="modal-head"><h2>Receive stock — ${esc(s.name)}</h2><span class="x" onclick="closeModal()">×</span></div>
  <div class="modal-body">
    <div class="grid g2" style="gap:0 14px"><label class="fld"><span class="lab">Batch / lot number</span><input id="lrc-batch" placeholder="e.g. L2406-3"></label>
      <label class="fld"><span class="lab">Expiry (YYYY-MM)</span><input id="lrc-exp" placeholder="2027-03"></label></div>
    <div class="grid g2" style="gap:0 14px"><label class="fld"><span class="lab">Quantity received (${esc(s.unit||"units")})</span><input id="lrc-qty" type="number" min="1"></label>
      <label class="fld"><span class="lab">Unit cost</span><input id="lrc-cost" type="number" value="${s.cost!=null?s.cost:''}" placeholder="optional"></label></div>
    <label class="fld"><span class="lab">Note (supplier, GRN, optional)</span><input id="lrc-note"></label>

  <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doLabReceive('${id}')">Receive</button></div>`);

function doLabReceive(id){ const qty=Number($("#lrc-qty").value)||0; if(qty<=0){alert("Enter a quantity received.");return;} labReceive(id,$("#lrc-batch").value,qty,$("#lrc-exp").value,$("#lrc-cost").value.trim(),$("#lrc-note").value.trim()); save(); closeModal(); renderLabView(); toast("Stock received"); }

function labBatchesModal(id){ const s=labItem(id); if(!s)return; const bs=labItemBatches(id).slice().sort((a,b)=>((a.expiry||"9999")<(b.expiry||"9999")?-1:1));
  modal(`<div class="modal-head"><h2>Batches — ${esc(s.name)}</h2><span class="x" onclick="closeModal()">×</span></div>
  <div class="modal-body">
    ${bs.length?`<table><thead><tr><th>Batch</th><th>Expiry</th><th class="right">Received</th><th class="right">On hand</th><th></th></tr></thead><tbody>
    ${bs.map(b=>{const exp=b.expiry?(new Date(b.expiry+"-01")<new Date()?'<span class="pill due">expired</span>':esc(b.expiry)):"—";return `<tr><td><b>${esc(b.batchNo)}</b></td><td>${exp}</td><td class="right muted">${b.qtyReceived}</td><td class="right" style="font-weight:700">${b.qtyOnHand}</td>
      <td class="right" style="white-space:nowrap"><button class="btn sm" onclick="labBatchAdjust('${id}','${b.id}',1)">+1</button> <button class="btn sm" onclick="labBatchAdjust('${id}','${b.id}',-1)">−1</button> <button class="btn sm ghost" onclick="labBatchCorrect('${id}','${b.id}')">Correct…</button> <button class="btn sm danger" onclick="labBatchWriteOff('${id}','${b.id}')">Write off</button></td></tr>`;}).join("")}
    </tbody></table>`:`<div class="muted">No batches yet. Use “Receive” to add stock.</div>`}
    <div class="muted" style="font-size:12px;margin-top:10px">On-hand and earliest expiry come from these batches. Every change is recorded in the reagent ledger.</div>
  </div>
  <div class="modal-foot"><button class="btn primary" onclick="labReceiveModal('${id}')">+ Receive new batch</button><button class="btn" onclick="closeModal()">Close</button></div>`);
}
function labBatchAdjust(id,bid,delta){ labAdjustBatch(bid,delta,"Adjustment"); save(); labBatchesModal(id); }
function labBatchCorrect(id,bid){ const b=(DB.labBatches||[]).find(x=>x.id===bid); if(!b)return; const v=prompt("Set the correct on-hand quantity for batch "+b.batchNo+":",b.qtyOnHand); if(v===null)return; const t=Number(v); if(isNaN(t)||t<0){alert("Enter a valid number.");return;} labAdjustBatch(bid,t-Number(b.qtyOnHand),"Stock correction"); save(); labBatchesModal(id); }
function labBatchWriteOff(id,bid){ const b=(DB.labBatches||[]).find(x=>x.id===bid); if(!b)return; if(!confirm("Write off all "+b.qtyOnHand+" of batch "+b.batchNo+"?"))return; labAdjustBatch(bid,-Number(b.qtyOnHand),"expired"); save(); labBatchesModal(id); }

  $("#lab-body").innerHTML=`

    ${toCollect.map(it=>{const t=findLabTest(it.s.serviceName);return `<tr>

      <td class="right"><button class="btn sm primary" onclick="collectSpecimenModal('${it.v.id}','${it.s.id}')">Collect specimen</button></td></tr>`;}).join("")}
    </tbody></table>`:`<div class="empty"><div class="big">Nothing pending collection</div>Newly ordered tests appear here first.</div>`}
  </div></div>
  <div class="card"><div class="card-head"><h2>Ready to result</h2><span class="sub">${toResult.length} specimen(s) in hand</span></div>
  <div class="card-pad" style="padding:6px 0">
    ${toResult.length?`<table><thead><tr><th>Patient</th><th>Test</th><th>Accession no.</th><th>Collected</th><th></th></tr></thead><tbody>
    ${toResult.map(it=>{const mins=Math.round((Date.now()-new Date(it.s.specimen.collectedAt))/60000);return `<tr>
      <td><b>${it.p?esc(it.p.name):"—"}</b><br><span class="faint" style="font-size:11px">${it.p?esc(it.p.regNo):""}</span></td>
      <td>${esc(it.s.serviceName)}</td>
      <td class="muted" style="font-size:12px">${esc(it.s.specimen.accessionNo)}</td>
      <td class="muted" style="font-size:12px">${new Date(it.s.specimen.collectedAt).toLocaleTimeString()} <span class="${mins>60?'flag-hi':''}">(${mins<60?mins+"m":Math.round(mins/60)+"h"} ago)</span></td>
      <td class="right"><button class="btn sm ghost" onclick="rejectSpecimenModal('${it.v.id}','${it.s.id}')">Reject</button> <button class="btn sm primary" onclick="enterLabResult('${it.v.id}','${it.s.id}')">Enter result</button></td></tr>`;}).join("")}
    </tbody></table>`:`<div class="empty"><div class="big">No specimens ready</div>Collect a specimen to move it here.</div>`}
  </div></div>`;
}
function collectSpecimenModal(vid,sid){
  const v=DB.visits.find(x=>x.id===vid); const s=v&&v.steps.find(x=>x.id===sid); if(!s)return; const p=patient(v.patientId);
  const t=findLabTest(s.serviceName);
  if(!s.specimen){ DB.labSeq=(DB.labSeq||0)+1; s.specimen={accessionNo:"LAB-"+new Date().getFullYear()+"-"+String(DB.labSeq).padStart(5,"0"),status:"Ordered",collectedAt:null,collectedBy:null,rejections:[]}; }
  modal(`<div class="modal-head"><h2>Collect specimen — ${esc(s.serviceName)}</h2><span class="x" onclick="closeModal()">×</span></div>
  <div class="modal-body">
    <div class="muted" style="margin-bottom:10px">${p?esc(p.name):""} · ${p?esc(p.regNo):""}${t&&t.specimen?" · "+esc(t.specimen):""}</div>
    <label class="fld"><span class="lab">Accession no.</span><input id="cs-accno" value="${esc(s.specimen.accessionNo)}"></label>
    <label class="fld"><span class="lab">Collected at</span><input id="cs-time" type="datetime-local" value="${now().slice(0,16)}"></label>
    <label class="fld"><span class="lab">Collected by</span><input id="cs-by" value="${currentUser?esc(currentUser.name):""}"></label>
  </div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doCollectSpecimen('${vid}','${sid}')">Confirm collection</button></div>`);
}
function doCollectSpecimen(vid,sid){
  const v=DB.visits.find(x=>x.id===vid); const s=v&&v.steps.find(x=>x.id===sid); if(!s)return;
  s.specimen.accessionNo=$("#cs-accno").value.trim()||s.specimen.accessionNo;
  s.specimen.collectedAt=$("#cs-time").value?new Date($("#cs-time").value).toISOString():now();
  s.specimen.collectedBy=$("#cs-by").value.trim();
  s.specimen.status="Collected";
  save(); closeModal(); renderLabView(); toast("Specimen collected — "+s.specimen.accessionNo);
}
function rejectSpecimenModal(vid,sid){
  const v=DB.visits.find(x=>x.id===vid); const s=v&&v.steps.find(x=>x.id===sid); if(!s)return;
  modal(`<div class="modal-head"><h2>Reject specimen</h2><span class="x" onclick="closeModal()">×</span></div>
  <div class="modal-body">
    <label class="fld"><span class="lab">Reason</span><select id="rj-reason"><option>Haemolysed</option><option>Insufficient volume</option><option>Wrong container/tube</option><option>Clotted sample</option><option>Unlabelled / mislabelled</option><option>Delayed in transit</option><option>Other</option></select></label>
    <div class="muted" style="font-size:12.5px">This sends the request back for re-collection. The patient may need to be re-bled/re-sampled.</div>
  </div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doRejectSpecimen('${vid}','${sid}')">Reject & request re-collection</button></div>`);
}
function doRejectSpecimen(vid,sid){
  const v=DB.visits.find(x=>x.id===vid); const s=v&&v.steps.find(x=>x.id===sid); if(!s)return;
  if(!s.specimen.rejections)s.specimen.rejections=[];
  s.specimen.rejections.push({reason:$("#rj-reason").value,at:now(),by:currentUser?currentUser.name:""});
  s.specimen.status="Ordered"; s.specimen.collectedAt=null; s.specimen.collectedBy=null;
  save(); closeModal(); renderLabView(); toast("Specimen rejected — awaiting re-collection");
}

function enterLabResult(vid,sid){
  const v=DB.visits.find(x=>x.id===vid); const s=v&&v.steps.find(x=>x.id===sid); if(!s)return; const p=patient(v.patientId);
  const test=findLabTest(s.serviceName);
  const analytes=test?test.analytes:[{name:s.serviceName,unit:"",refText:""}];
  const ex=s.labResult;
  const rows=analytes.map((a,i)=>{
    const ev=ex&&ex.values[i]?ex.values[i].value:"";
    const ref=a.refText?a.refText:(a.refLow!=null?`${a.refLow} – ${a.refHigh}`:"");
    return `<tr><td style="font-weight:600">${esc(a.name)}</td>
      <td><input id="lv-${i}" value="${esc(ev)}" oninput="liveFlag(${i})" style="padding:7px"></td>
      <td class="muted">${esc(a.unit||"")}</td><td class="muted" style="font-size:12px">${esc(ref)}</td>
      <td id="lf-${i}" style="font-weight:700;font-size:12px"></td></tr>`;
  }).join("");
  window._labAnalytes=analytes;
  const tat=s.specimen&&s.specimen.collectedAt?Math.round((Date.now()-new Date(s.specimen.collectedAt))/60000):null;
  modal(`<div class="modal-head"><h2>${esc(s.serviceName)}</h2><span class="x" onclick="closeModal()">×</span></div>
  <div class="modal-body">
    <div class="muted" style="margin-bottom:10px">${p?esc(p.name):""} · ${p?esc(p.regNo):""}${test&&test.specimen?` · specimen: ${esc(test.specimen)}`:""}</div>
    ${s.specimen?`<div class="muted" style="font-size:12px;margin-bottom:10px">Accession ${esc(s.specimen.accessionNo)} · collected ${s.specimen.collectedAt?new Date(s.specimen.collectedAt).toLocaleString():"—"}${tat!=null?" · "+(tat<60?tat+" min":Math.round(tat/60)+" hr")+" since collection":""}</div>`:""}
    <table><thead><tr><th>Analyte</th><th>Result</th><th>Unit</th><th>Reference</th><th>Flag</th></tr></thead><tbody>${rows}</tbody></table>
    <label class="fld" style="margin-top:12px"><span class="lab">Conclusion / comment</span><textarea id="lv-concl" rows="2">${ex?esc(ex.conclusion||""):""}</textarea></label>
    <label class="row" style="gap:8px;margin-top:10px"><input type="checkbox" id="lv-critical" ${ex&&ex.critical&&ex.critical.flag?"checked":""} style="width:auto" onchange="toggleCriticalFields()"> <span style="font-weight:600;color:var(--red)">⚠ This result includes a critical/panic value</span></label>
    <div id="lv-critical-fields" style="${ex&&ex.critical&&ex.critical.flag?"":"display:none"};margin-top:8px;border:1px solid var(--red);background:var(--red-tint);border-radius:8px;padding:10px">
      <label class="fld" style="margin:0"><span class="lab">Notified to (clinician name)</span><input id="lv-notifyto" value="${ex&&ex.critical?esc(ex.critical.notifiedTo||""):""}"></label>
      <label class="fld" style="margin-top:6px"><span class="lab">Notified at</span><input id="lv-notifyat" type="datetime-local" value="${ex&&ex.critical&&ex.critical.notifiedAt?ex.critical.notifiedAt.slice(0,16):now().slice(0,16)}"></label>
    </div>
  </div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveLabResult('${vid}','${sid}')">Save & complete</button></div>`);
  analytes.forEach((a,i)=>liveFlag(i));
}
function toggleCriticalFields(){ const on=$("#lv-critical").checked; $("#lv-critical-fields").style.display=on?"":"none"; }
function liveFlag(i){ const a=window._labAnalytes[i]; const el=$("#lv-"+i); const out=$("#lf-"+i); if(!a||!el||!out)return; const f=flagOf(a,el.value); out.textContent=f; out.className=flagClass(f); }
function saveLabResult(vid,sid){
  const v=DB.visits.find(x=>x.id===vid); const s=v&&v.steps.find(x=>x.id===sid); if(!s)return;
  const isCritical=$("#lv-critical").checked;
  if(isCritical&&!$("#lv-notifyto").value.trim()){ alert("This is marked as a critical/panic value — enter who was notified before saving."); return; }
  const analytes=window._labAnalytes||[];
  const values=analytes.map((a,i)=>{const val=($("#lv-"+i)?$("#lv-"+i).value.trim():""); return {analyte:a.name,value:val,unit:a.unit||"",ref:a.refText?a.refText:(a.refLow!=null?`${a.refLow} – ${a.refHigh}`:""),flag:flagOf(a,val)};});
  s.labResult={testName:s.serviceName,values,conclusion:($("#lv-concl")?$("#lv-concl").value.trim():""),
    critical:isCritical?{flag:true,notifiedTo:$("#lv-notifyto").value.trim(),notifiedAt:$("#lv-notifyat").value?new Date($("#lv-notifyat").value).toISOString():now()}:{flag:false},
    at:now(),by:currentUser?currentUser.name:"",status:"final"};
  s.status="done"; s.at=s.at||now(); s.resultAt=now();
  if(s.specimen) s.specimen.status="Resulted";
  if(!s.consumed){ const test=findLabTest(s.serviceName); if(test&&test.uses&&test.uses.length){ test.uses.forEach(u=>{ if(u.qty>0) labConsumeFEFO(u.stockId,u.qty,"Used: "+s.serviceName); }); } s.consumed=true; }
  save(); closeModal();
  if(confirm("Result saved. Print the lab report now?")) labReport(vid,sid);
  renderLabView();
}
function labReport(vid,sid){
  const v=DB.visits.find(x=>x.id===vid); const s=v&&v.steps.find(x=>x.id===sid); if(!s||!s.labResult)return; const p=patient(v.patientId); const r=s.labResult;
  const rows=r.values.map(x=>`<tr><td>${esc(x.analyte)}</td><td style="font-weight:700">${esc(x.value||"—")}</td><td>${esc(x.unit)}</td><td>${esc(x.ref)}</td><td style="font-weight:700;color:${x.flag==="High"||x.flag==="Check"?"#D94A4A":x.flag==="Low"?"#E08A1E":"#1FA971"}">${esc(x.flag)}</td></tr>`).join("");
  const html=`<div style="font-family:sans-serif;max-width:640px;margin:auto">
    <div style="display:flex;justify-content:space-between;border-bottom:2px solid #0E9F8E;padding-bottom:8px">
      <div><h2 style="margin:0;color:#0B7C70">${esc(DB.clinic.name)}</h2><div style="font-size:12px;color:#555">${esc(DB.clinic.address||"")} ${DB.clinic.phone?("· "+esc(DB.clinic.phone)):""}</div></div>
      <div style="text-align:right;font-size:12px;color:#555"><b>LABORATORY REPORT</b><br>${new Date(r.at).toLocaleString()}${s.specimen?"<br>Accession: "+esc(s.specimen.accessionNo):""}</div>
    </div>
    <table style="width:100%;margin:10px 0;font-size:13px"><tr><td><b>Patient:</b> ${p?esc(p.name):"—"}</td><td><b>Reg:</b> ${p?esc(p.regNo):""}</td><td><b>Sex/Age:</b> ${p?esc(p.sex||""):""} ${p?ageOf(p):""}</td></tr></table>
    <h3 style="margin:6px 0;color:#0B7C70">${esc(r.testName)}</h3>
    ${r.critical&&r.critical.flag?`<div style="border:2px solid #D94A4A;background:#FCEAEA;border-radius:6px;padding:8px;margin-bottom:10px;font-size:13px"><b style="color:#D94A4A">⚠ CRITICAL VALUE</b> — notified to ${esc(r.critical.notifiedTo||"—")} at ${r.critical.notifiedAt?new Date(r.critical.notifiedAt).toLocaleString():"—"}</div>`:""}
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="background:#E6F6F3"><th style="text-align:left;padding:7px">Analyte</th><th style="text-align:left;padding:7px">Result</th><th style="text-align:left;padding:7px">Unit</th><th style="text-align:left;padding:7px">Reference</th><th style="text-align:left;padding:7px">Flag</th></tr></thead>
      <tbody>${rows}</tbody></table>
    ${r.conclusion?`<p style="font-size:13px"><b>Comment:</b> ${esc(r.conclusion)}</p>`:""}
    <div style="margin-top:24px;font-size:12px;color:#555">Performed by: <b>${esc(r.by||"")}</b><br>Authorised signature: ____________________</div>
    <div style="margin-top:10px;font-size:10px;color:#999;text-align:center">Generated by ${esc(DB.clinic.name)}</div>
  </div>`;
  const w=window.open("","_blank"); w.document.write("<html><head><title>Lab report</title></head><body>"+html+"</body></html>"); w.document.close(); w.print();
}

function labResultsArchive(){
  const done=[]; DB.visits.forEach(v=>v.steps.forEach(s=>{ if(s.dept==="Laboratory"&&s.labResult) done.push({v,s,p:patient(v.patientId)}); }));
  done.sort((a,b)=>new Date(b.s.labResult.at)-new Date(a.s.labResult.at));
  const withTat=done.filter(it=>it.s.specimen&&it.s.specimen.collectedAt);
  const avgTatMin=withTat.length?Math.round(withTat.reduce((a,it)=>a+(new Date(it.s.labResult.at)-new Date(it.s.specimen.collectedAt))/60000,0)/withTat.length):null;
  $("#lab-body").innerHTML=`

/* ================= PHARMACY MODULE ================= */
function drugs(){ return DB.drugs||[]; }
/* ============= BATCH + LEDGER FOUNDATION ============= */
function drugBatches(id){ return (DB.batches||[]).filter(b=>b.drugId===id); }
function onHandBatches(id){ return drugBatches(id).filter(b=>Number(b.qtyOnHand)>0).sort((a,b)=>{const ax=a.expiry||"9999-99",bx=b.expiry||"9999-99";return ax<bx?-1:ax>bx?1:(new Date(a.receivedAt||0)-new Date(b.receivedAt||0));}); }
function recomputeStock(db){ db=db||DB; (db.drugs||[]).forEach(d=>{ const bs=(db.batches||[]).filter(b=>b.drugId===d.id); d.qty=bs.reduce((a,b)=>a+(Number(b.qtyOnHand)||0),0); const ex=bs.filter(b=>(Number(b.qtyOnHand)||0)>0&&b.expiry).map(b=>b.expiry).sort(); d.expiry=ex[0]||""; }); }
function ensureOpeningBatches(db){ if(!db.batches)db.batches=[]; if(!db.ledger)db.ledger=[]; (db.drugs||[]).forEach(d=>{ const has=db.batches.some(b=>b.drugId===d.id); if(!has&&Number(d.qty)>0){ const b={id:uid(),drugId:d.id,batchNo:"OPENING",expiry:d.expiry||"",qtyReceived:Number(d.qty),qtyOnHand:Number(d.qty),cost:(d.cost!=null?d.cost:null),receivedAt:now(),by:"system"}; db.batches.push(b); db.ledger.push({id:uid(),drugId:d.id,batchId:b.id,type:"opening",qty:Number(d.qty),ref:"Opening balance",at:now(),by:"system"}); } }); }
function ledgerAdd(e){ if(!DB.ledger)DB.ledger=[]; DB.ledger.push(Object.assign({id:uid(),at:now(),by:currentUser?currentUser.name:""},e)); }
function receiveStock(drugId,batchNo,qty,expiry,cost,note){ qty=Number(qty)||0; if(qty<=0)return; const b={id:uid(),drugId,batchNo:((batchNo||"-")+"").trim()||"-",expiry:((expiry||"")+"").trim(),qtyReceived:qty,qtyOnHand:qty,cost:(cost===""||cost==null?null:Number(cost)),receivedAt:now(),by:currentUser?currentUser.name:""}; DB.batches.push(b); ledgerAdd({drugId,batchId:b.id,type:"receive",qty:qty,ref:"Received",note:note||""}); recomputeStock(); }
function dispenseFromBatches(drugId,qty,patientId){ let need=Number(qty)||0; const allocations=[]; onHandBatches(drugId).forEach(b=>{ if(need<=0)return; const take=Math.min(need,Number(b.qtyOnHand)); b.qtyOnHand=Number(b.qtyOnHand)-take; need-=take; if(take>0)allocations.push({batchId:b.id,qty:take}); ledgerAdd({drugId,batchId:b.id,type:"dispense",qty:-take,ref:"Dispensed",patientId:patientId||null}); }); recomputeStock(); return {fulfilled:qty-need,allocations}; }
function restoreBatchAllocations(allocations){ (allocations||[]).forEach(a=>{ const b=(DB.batches||[]).find(x=>x.id===a.batchId); if(b){ b.qtyOnHand=Number(b.qtyOnHand)+Number(a.qty); ledgerAdd({drugId:b.drugId,batchId:b.id,type:"void-restore",qty:a.qty,ref:"Void restore"}); } }); recomputeStock(); }
function adjustBatch(batchId,delta,reason){ const b=(DB.batches||[]).find(x=>x.id===batchId); if(!b)return; const nd=Math.max(0,Number(b.qtyOnHand)+delta); const applied=nd-Number(b.qtyOnHand); b.qtyOnHand=nd; ledgerAdd({drugId:b.drugId,batchId,type:(reason==="expired"?"expire":"adjust"),qty:applied,ref:reason||"Adjustment"}); recomputeStock(); }

function batchesModal(id){ const d=drugById(id); if(!d)return; const bs=drugBatches(id).slice().sort((a,b)=>((a.expiry||"9999")<(b.expiry||"9999")?-1:1));
  modal(`<div class="modal-head"><h2>Batches — ${esc(d.name)}</h2><span class="x" onclick="closeModal()">×</span></div>
  <div class="modal-body">
    ${bs.length?`<table><thead><tr><th>Batch</th><th>Expiry</th><th class="right">Received</th><th class="right">On hand</th><th></th></tr></thead><tbody>
    ${bs.map(b=>{const exp=b.expiry?(new Date(b.expiry+"-01")<new Date()?'<span class="pill due">expired</span>':esc(b.expiry)):"—";return `<tr><td><b>${esc(b.batchNo)}</b></td><td>${exp}</td><td class="right muted">${b.qtyReceived}</td><td class="right" style="font-weight:700">${b.qtyOnHand}</td>
      <td class="right" style="white-space:nowrap"><button class="btn sm" onclick="batchAdjust('${id}','${b.id}',1)">+1</button> <button class="btn sm" onclick="batchAdjust('${id}','${b.id}',-1)">−1</button> <button class="btn sm ghost" onclick="batchCorrect('${id}','${b.id}')">Correct…</button> <button class="btn sm danger" onclick="batchWriteOff('${id}','${b.id}')">Write off</button></td></tr>`;}).join("")}
    </tbody></table>`:`<div class="muted">No batches yet. Use “Receive” to add stock.</div>`}
    <div class="muted" style="font-size:12px;margin-top:10px">On-hand totals and earliest expiry are calculated from these batches. Every change is recorded in the stock ledger.</div>
  </div>
  <div class="modal-foot"><button class="btn primary" onclick="receiveModal('${id}')">+ Receive new batch</button><button class="btn" onclick="closeModal()">Close</button></div>`);
}
function batchAdjust(id,bid,delta){ adjustBatch(bid,delta,"Adjustment"); save(); batchesModal(id); }
function batchCorrect(id,bid){ const b=(DB.batches||[]).find(x=>x.id===bid); if(!b)return; const v=prompt("Set the correct on-hand quantity for batch "+b.batchNo+":",b.qtyOnHand); if(v===null)return; const target=Number(v); if(isNaN(target)||target<0){alert("Enter a valid number.");return;} adjustBatch(bid,target-Number(b.qtyOnHand),"Stock correction"); save(); batchesModal(id); }
function batchWriteOff(id,bid){ const b=(DB.batches||[]).find(x=>x.id===bid); if(!b)return; if(!confirm("Write off all "+b.qtyOnHand+" of batch "+b.batchNo+" (e.g. expired/damaged)?"))return; adjustBatch(bid,-Number(b.qtyOnHand),"expired"); save(); batchesModal(id); }

/* ---- Stock ledger viewer ---- */

  const typeLbl={opening:"Opening",receive:"Received",dispense:"Dispensed",adjust:"Adjusted",expire:"Written off",stocktake:"Stock-take"};

function drugById(id){ return drugs().find(d=>d.id===id); }
function lowDrugs(){ return drugs().filter(d=>Number(d.qty)<=Number(d.reorder)); }
function expiringSoon(){ const lim=new Date(); lim.setMonth(lim.getMonth()+3); const out=new Set(); drugs().forEach(d=>drugBatches(d.id).forEach(b=>{ if(Number(b.qtyOnHand)>0&&b.expiry){ const e=new Date(b.expiry+"-01"); if(e<=lim) out.add(d); } })); return [...out]; }
function checkInteractions(names){
  const low=names.map(n=>(""+n).toLowerCase()); const out=[];
  (DB.interactions||[]).forEach(ix=>{ const ha=low.some(n=>n.includes(ix.a)), hb=low.some(n=>n.includes(ix.b)); if(ha&&hb) out.push(ix); });
  return out;
}
function checkAllergyMatches(pid,names){
  const p=patient(pid); if(!p||!p.allergies)return [];
  const allergyTerms=p.allergies.split(/[,;]/).map(a=>a.trim().toLowerCase()).filter(Boolean);
  if(!allergyTerms.length)return [];
  const out=[];
  names.forEach(n=>{ const nl=(""+n).toLowerCase(); allergyTerms.forEach(a=>{ if(a.length>2&&(nl.includes(a)||a.includes(nl))) out.push({drug:n,allergen:a}); }); });
  return out;
}

/* ============= PHARMACY ADVISORY ENGINE ============= */
const ABX=["amoxicillin","amoxiclav","co-amoxiclav","ampicillin","cloxacillin","flucloxacillin","penicillin","ciprofloxacin","levofloxacin","norfloxacin","ceftriaxone","cefixime","cefuroxime","cefalexin","cephalexin","azithromycin","erythromycin","clarithromycin","clindamycin","metronidazole","gentamicin","amikacin","doxycycline","tetracycline","cotrimoxazole","nitrofurantoin","chloramphenicol"];
function isAbx(name){ const n=(""+name).toLowerCase(); return ABX.some(a=>n.includes(a)); }
function dispenseHistory(){ const out=[]; DB.visits.forEach(v=>v.steps.forEach(s=>{ if(s.dept==="Pharmacy"&&s.dispense&&s.dispense.items) s.dispense.items.forEach(i=>out.push({drug:i.drug,qty:i.qty,price:i.price,at:s.dispense.at})); })); return out; }
function drugStats(days){
  const since=Date.now()-days*86400000; const hist=dispenseHistory().filter(h=>new Date(h.at).getTime()>=since);
  const by={}; hist.forEach(h=>{ const k=h.drug; (by[k]=by[k]||{units:0,rev:0}); by[k].units+=h.qty; by[k].rev+=h.price; });
  return drugs().map(d=>{
    const st=by[d.name]||{units:0,rev:0}; const dailyRate=st.units/days;
    const daysCover=dailyRate>0?Math.round(d.qty/dailyRate):Infinity;
    const hasCost=d.cost!=null&&d.cost!=="";
    const margin=hasCost?(d.price-Number(d.cost)):null;
    const marginPct=(margin!=null&&d.price>0)?Math.round(margin/d.price*100):null;
    const stockValue=(hasCost?Number(d.cost):d.price)*d.qty;
    return {d,units:st.units,rev:st.rev,dailyRate,daysCover,margin,marginPct,stockValue,hasCost};
  });
}
function expiryDays(d){ if(!d.expiry)return null; return Math.round((new Date(d.expiry+"-01")-Date.now())/86400000); }

function advFinancial(){
  const s=drugStats(30); const out=[];
  s.filter(x=>x.dailyRate>0&&x.daysCover!==Infinity&&x.daysCover<=14).sort((a,b)=>b.rev-a.rev).slice(0,5)
   .forEach(x=>out.push({sev:"up",t:`Stock more — ${x.d.name}`,d:`Selling ≈${x.dailyRate.toFixed(1)}/day; only ~${x.daysCover} day(s) of stock left. Increasing the order avoids lost sales and lifts business yield.`}));
  s.filter(x=>x.d.qty>0&&(x.units===0||x.daysCover>365)).sort((a,b)=>b.stockValue-a.stockValue).slice(0,5)
   .forEach(x=>out.push({sev:"down",t:`Ease off — ${x.d.name}`,d:`${x.units===0?"No":"Very slow"} dispensing in 30 days, yet ${money(Math.round(x.stockValue))} is tied up (${x.d.qty} ${esc(x.d.unit||"")}). Reduce future orders to free cash for faster movers.`}));
  s.filter(x=>x.marginPct!=null&&x.units>0&&x.marginPct<15).sort((a,b)=>b.units-a.units).slice(0,5)
   .forEach(x=>out.push({sev:"margin",t:`Review margin — ${x.d.name}`,d:`Margin ≈${x.marginPct}% on ${x.units} sold this month. A lower buy price or a small price adjustment would raise productivity.`}));
  const noCost=s.filter(x=>x.units>0&&!x.hasCost).slice(0,8);
  if(noCost.length) out.push({sev:"info",t:"Add buy prices to unlock margin advice",d:`Enter the buy (purchase) price for these movers so margin can be assessed: ${noCost.map(x=>esc(x.d.name)).join(", ")}.`});
  if(!out.length) out.push({sev:"info",t:"No financial actions yet",d:"As more dispensing is recorded, stock-more / ease-off and margin suggestions will appear here."});
  return out;
}
function advStock(){
  const s=drugStats(30); const out=[]; const seen=new Set();
  drugs().map(d=>({d,days:expiryDays(d)})).filter(x=>x.days!=null&&x.days<=120).sort((a,b)=>a.days-b.days)
   .forEach(x=>{ seen.add(x.d.name); out.push({sev:x.days<=30?"down":"margin",t:`Expiry — ${x.d.name}`,d:x.days<0?`Expired ${-x.days} day(s) ago — remove from the shelf.`:`Expires in ~${x.days} day(s)${x.days>=30?` (≈${Math.round(x.days/30)} month(s))`:""}, on ${x.d.expiry}. ${x.d.qty} ${esc(x.d.unit||"")} on hand — prioritise dispensing or plan a return.`}); });
  s.filter(x=>x.dailyRate>0&&x.daysCover<=21).sort((a,b)=>a.daysCover-b.daysCover)
   .forEach(x=>out.push({sev:x.daysCover<=7?"down":"up",t:`Running out — ${x.d.name}`,d:`≈${x.daysCover} day(s) left at the current rate (${x.dailyRate.toFixed(1)}/day). Reorder about ${Math.ceil(x.dailyRate*30)} ${esc(x.d.unit||"")} for ~30 days cover.`}));
  lowDrugs().filter(d=>!seen.has(d.name)).forEach(d=>out.push({sev:"down",t:`Below reorder level — ${d.name}`,d:`${d.qty} ${esc(d.unit||"")} in stock (reorder at ${d.reorder}).`}));
  if(!out.length) out.push({sev:"info",t:"Stock looks healthy",d:"No expiries within 4 months and nothing projected to run out soon."});
  return out;
}
function advClinical(){
  const out=[]; const since=Date.now()-30*86400000; const recent=dispenseHistory().filter(h=>new Date(h.at).getTime()>=since);
  const total=recent.reduce((a,h)=>a+h.qty,0); const abxU=recent.filter(h=>isAbx(h.drug)).reduce((a,h)=>a+h.qty,0);
  if(total>0&&abxU>0){ const pct=Math.round(abxU/total*100); out.push({sev:pct>=40?"down":"info",t:"Antibiotic share of dispensing",d:`Antibiotics are ≈${pct}% of units dispensed (30 days). A high or rising share is worth reviewing with prescribers for stewardship.`}); }
  const byAbx={}; recent.filter(h=>isAbx(h.drug)).forEach(h=>byAbx[h.drug]=(byAbx[h.drug]||0)+h.qty);
  Object.entries(byAbx).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([n,c])=>out.push({sev:"info",t:`Fast-moving antibiotic — ${n}`,d:`${c} units in 30 days. Confirm prescribing aligns with guidelines; consider an AMS review if unusually high.`}));
  const pairs={}; DB.visits.forEach(v=>v.steps.forEach(s=>{ if(s.dept==="Pharmacy"&&s.dispense&&s.dispense.items){ const names=s.dispense.items.map(i=>(""+i.drug).toLowerCase()); (DB.interactions||[]).forEach(ix=>{ if(names.some(n=>n.includes(ix.a))&&names.some(n=>n.includes(ix.b))){ const k=ix.a+" + "+ix.b; (pairs[k]=pairs[k]||{c:0,sev:ix.sev,note:ix.note}); pairs[k].c++; } }); } }));
  Object.entries(pairs).sort((a,b)=>b[1].c-a[1].c).slice(0,4).forEach(([k,o])=>out.push({sev:o.sev==="Major"?"down":"margin",t:`Interacting pair dispensed — ${k}`,d:`${o.sev}: ${o.note}. Co-dispensed ${o.c} time(s) — review for appropriateness.`}));
  out.push({sev:"info",t:"Note on clinical advice",d:"These are signals for your professional judgment, not instructions — and a missing warning is never an all-clear. Allergy, weight and renal-function data aren't captured yet, so allergy and dose-by-kidney checks aren't available."});
  return out;
}
function advGeneral(){ const all=[...advStock(),...advFinancial(),...advClinical()]; const rank={down:0,up:1,margin:2,info:3}; return all.filter(x=>x.sev!=="info").sort((a,b)=>rank[a.sev]-rank[b.sev]).slice(0,7); }
function advUrgentCount(){ return [...advStock(),...advFinancial(),...advClinical()].filter(x=>x.sev==="down").length; }

function advItem(x){ const c={down:"var(--red)",up:"var(--teal-deep)",margin:"var(--amber)",info:"var(--muted)"}[x.sev]||"var(--muted)";
