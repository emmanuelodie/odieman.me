const DOMAINS={
  pharmacy:{label:"Pharmacy",dept:"Pharmacy",key:"drugId",items:()=>DB.drugs||[],batches:()=>DB.batches||[],ledger:()=>DB.ledger||[],
    unit:i=>i.unit,name:i=>i.name,reorder:i=>i.reorder,barcode:i=>i.barcode||"",addBatch:b=>DB.batches.push(b),recompute:()=>recomputeStock(),ledgerAdd:e=>ledgerAdd(e),consumeFEFO:(id,q,r)=>dispenseFromBatchesRef(id,q,r),onHand:id=>onHandBatches(id),render:()=>renderPharmacyView()},
  lab:{label:"Laboratory",dept:"Laboratory",key:"itemId",items:()=>DB.labStock||[],batches:()=>DB.labBatches||[],ledger:()=>DB.labLedger||[],
    unit:i=>i.unit,name:i=>i.name,reorder:i=>i.reorder,barcode:i=>i.barcode||"",addBatch:b=>DB.labBatches.push(b),recompute:()=>recomputeLabStock(),ledgerAdd:e=>labLedgerAdd(e),consumeFEFO:(id,q,r)=>labConsumeFEFO(id,q,r),onHand:id=>labOnHandBatches(id),render:()=>renderLabView()}
};
function dom(k){return DOMAINS[k];}
function dLedgerFor(k,id){const key=dom(k).key;return dom(k).ledger().filter(e=>e[key]===id);}
function dBatchesFor(k,id){const key=dom(k).key;return dom(k).batches().filter(b=>b[key]===id);}
function monthBounds(ym){return {start:ym+"-01T00:00:00.000Z",end:ym+"-31T23:59:59.999Z"};}
function curYM(){return new Date().toISOString().slice(0,7);}

function rnrRow(k,item,start,end){
  const led=dLedgerFor(k,item.id);
  const opening=led.filter(e=>e.at<start).reduce((a,e)=>a+Number(e.qty),0);
  const inP=led.filter(e=>e.at>=start&&e.at<=end);
  const received=inP.filter(e=>e.type==="receive").reduce((a,e)=>a+Number(e.qty),0);
  const issued=-inP.filter(e=>e.type==="dispense"||e.type==="issue").reduce((a,e)=>a+Number(e.qty),0);
  const adj=inP.filter(e=>e.type==="adjust"||e.type==="expire"||e.type==="stocktake").reduce((a,e)=>a+Number(e.qty),0);
  const closing=opening+received-issued+adj;
  return {opening,received,issued,adj,closing};
}
function amc(k,item){ const since=Date.now()-90*86400000; const led=dLedgerFor(k,item.id).filter(e=>(e.type==="dispense"||e.type==="issue")&&new Date(e.at).getTime()>=since); const issued=-led.reduce((a,e)=>a+Number(e.qty),0); return Math.round(issued/3); }

function rnrRender(k){
  const {start,end}=monthBounds(repMonth); const items=dom(k).items();
  const rows=items.map(it=>{const r=rnrRow(k,it,start,end);const a=amc(k,it);const order=Math.max(0,a*2-r.closing);return {it,r,a,order};});
  $("#rep-out").innerHTML=`<div class="card"><div class="card-head"><h2>Report &amp; Requisition (R&amp;R)</h2><span class="sub">${dom(k).label} · ${repMonth}</span><span class="spacer"></span><button class="btn sm" onclick="printRnR('${k}')">Print</button></div>
  <div class="card-pad" style="padding:6px 0;overflow:auto">
    <table><thead><tr><th>Item</th><th class="right">Opening</th><th class="right">Received</th><th class="right">Issued</th><th class="right">Losses/Adj</th><th class="right">Closing</th><th class="right">AMC</th><th class="right">Order qty</th></tr></thead><tbody>
    ${rows.map(({it,r,a,order})=>`<tr><td><b>${esc(dom(k).name(it))}</b></td><td class="right">${r.opening}</td><td class="right">${r.received}</td><td class="right">${r.issued}</td><td class="right ${r.adj<0?'flag-hi':''}">${r.adj}</td><td class="right" style="font-weight:700">${r.closing}</td><td class="right muted">${a}</td><td class="right" style="font-weight:700;color:var(--teal-deep)">${order}</td></tr>`).join("")}
    </tbody></table>
  </div>
  <div class="card-pad muted" style="font-size:12px;padding-top:0">Columns follow the MoH/MSD R&amp;R logic: Opening + Received − Issued ± Adjustments = Closing. AMC = average monthly consumption over the last 3 months. Order qty is a suggestion for ~2 months' cover (AMC×2 − closing) — review before ordering.</div></div>`;
}
function printRnR(k){

    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:10px"><thead><tr style="background:#E6F6F3"><th style="text-align:left;padding:6px">Item</th><th style="padding:6px">Opening</th><th style="padding:6px">Received</th><th style="padding:6px">Issued</th><th style="padding:6px">Losses/Adj</th><th style="padding:6px">Closing</th><th style="padding:6px">AMC</th><th style="padding:6px">Order</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="margin-top:24px;font-size:12px;color:#555">Prepared by: ${esc(currentUser?currentUser.name:"")} ____________ &nbsp;&nbsp; Approved by: ____________</div></div>`);
}
function expiryRender(k){

function tsPick(k){
  const items=dom(k).items();
  $("#rep-out").innerHTML=`<div class="card"><div class="card-head"><h2>Time series</h2><span class="sub">consumption per ${k==='pharmacy'?'medication':'reagent'}</span></div>
  <div class="card-pad"><label class="fld" style="max-width:360px"><span class="lab">Choose an item</span><select onchange="tsRender('${k}',this.value)"><option value="">— select —</option>${items.map(it=>`<option value="${it.id}">${esc(dom(k).name(it))}</option>`).join("")}</select></label><div id="ts-out"></div></div></div>`;
}
function tsRender(k,id){ if(!id){$("#ts-out").innerHTML="";return;} const it=dom(k).items().find(x=>x.id===id); const months=[]; const d=new Date(); for(let i=5;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(m.toISOString().slice(0,7));}
  const led=dLedgerFor(k,id).filter(e=>e.type==="dispense"||e.type==="issue");
  const data=months.map(ym=>({ym,qty:-led.filter(e=>(e.at||"").slice(0,7)===ym).reduce((a,e)=>a+Number(e.qty),0)}));
  const max=Math.max(1,...data.map(d=>d.qty)); const W=440,H=160,bw=W/data.length;

function parseCSVText(text){
  return text.split(/\r?\n/).filter(l=>l.trim().length).map(line=>{
    const out=[]; let cur="",inQ=false;
    for(let i=0;i<line.length;i++){ const c=line[i];
      if(c==='"'){ inQ=!inQ; continue; }
      if(c===","&&!inQ){ out.push(cur); cur=""; continue; }
      cur+=c;
    }
    out.push(cur); return out.map(x=>x.trim());
  });
}
function loadXLSXLib(){
  return new Promise((res,rej)=>{
    if(window.XLSX){res();return;}
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=()=>res(); s.onerror=()=>rej();
    document.head.appendChild(s);
  });
}
function downloadCountTemplate(k){

  const a=document.createElement("a"); a.href=url; a.download=dom(k).label.replace(/\s+/g,"_")+"_stocktake_template.csv"; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function handleImportFile(k){
  const f=$("#imp-file").files[0]; if(!f)return;

  if(/\.(xlsx|xls)$/i.test(f.name)){

      const reader=new FileReader();
      reader.onload=e=>{ try{ const wb=XLSX.read(e.target.result,{type:"array"}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}); processImportRows(k,rows); }
        catch(err){ $("#imp-status").textContent="Could not read that Excel file. Try saving it as CSV instead."; } };
      reader.readAsArrayBuffer(f);
    }).catch(()=>{ $("#imp-status").textContent="Could not load Excel support (needs internet the first time). Please save the file as CSV and try again."; });
  } else {
    const reader=new FileReader();

function processImportRows(k,rows){
  if(!rows||!rows.length){ $("#imp-status").textContent="No rows found in that file."; return; }
  const header=rows[0].map(x=>(""+x).toLowerCase());
  let nameIdx=header.findIndex(h=>/item|name|drug|reagent|medic/.test(h));
  let bcIdx=header.findIndex(h=>/barcode|code/.test(h));
  let qtyIdx=header.findIndex(h=>/count|physical|qty|quantity/.test(h));
  let startRow=1;
  if(nameIdx<0&&qtyIdx<0&&bcIdx<0){ nameIdx=0; qtyIdx=1; startRow=0; }
  const items=dom(k).items();
  const matched=[],unmatched=[];
  for(let i=startRow;i<rows.length;i++){
    const row=rows[i]; if(!row||!row.length) continue;
    const nameVal=(nameIdx>=0?(""+(row[nameIdx]??"")):"").trim();
    const bcVal=(bcIdx>=0?(""+(row[bcIdx]??"")):"").trim();
    const qtyVal=qtyIdx>=0?row[qtyIdx]:"";
    if(qtyVal===""||qtyVal==null) continue;
    const qty=Number(qtyVal); if(isNaN(qty)) continue;
    let it=null;
    if(bcVal) it=items.find(x=>dom(k).barcode(x)&&dom(k).barcode(x).toLowerCase()===bcVal.toLowerCase());
    if(!it&&nameVal) it=items.find(x=>dom(k).name(x).toLowerCase().trim()===nameVal.toLowerCase());
    if(it) matched.push({it,qty}); else unmatched.push(nameVal||bcVal||"(blank)");
  }
  _importRows=matched;
  $("#imp-status").innerHTML=`<b>${matched.length}</b> item(s) matched${unmatched.length?`, <b style="color:var(--red)">${unmatched.length}</b> row(s) could not be matched`:""}.`;
  $("#imp-preview").innerHTML=(matched.length?`<table><thead><tr><th>Item</th><th class="right">System</th><th class="right">Counted</th><th class="right">Variance</th></tr></thead><tbody>
    ${matched.map(({it,qty})=>{const diff=qty-Number(it.qty);return `<tr><td>${esc(dom(k).name(it))}</td><td class="right muted">${it.qty}</td><td class="right" style="font-weight:700">${qty}</td><td class="right ${diff<0?'flag-hi':diff>0?'flag-ok':''}">${diff>0?'+':''}${diff}</td></tr>`;}).join("")}
  </tbody></table>`:"")+(unmatched.length?`<div class="muted" style="font-size:12px;margin-top:8px">Unmatched: ${unmatched.slice(0,10).map(esc).join(", ")}${unmatched.length>10?"…":""}</div>`:"");
  $("#imp-apply").style.display=matched.length?"":"none";
}
function applyImportedCounts(k){

function physVar(id,sys){ const el=$("#phc-"+id); const out=$("#phv-"+id); if(!el||!out)return; const v=el.value.trim(); if(v===""){out.textContent="—";out.className="right muted";return;} const diff=Number(v)-sys; _phys[id]=Number(v); out.textContent=(diff>0?"+":"")+diff; out.className="right "+(diff<0?"flag-hi":diff>0?"flag-ok":"muted"); }
function postStocktake(k){
  const ids=Object.keys(_phys); if(!ids.length){alert("Enter at least one physical count.");return;}
  const key=dom(k).key; let n=0;
  ids.forEach(id=>{ const it=dom(k).items().find(x=>x.id===id); if(!it)return; const diff=_phys[id]-Number(it.qty); if(diff===0)return; n++;
    if(diff<0){ let need=-diff; dom(k).onHand(id).forEach(b=>{ if(need<=0)return; const take=Math.min(need,Number(b.qtyOnHand)); b.qtyOnHand=Number(b.qtyOnHand)-take; need-=take; dom(k).ledgerAdd({[key]:id,batchId:b.id,type:"stocktake",qty:-take,ref:"Stock-take shortfall"}); }); }
    else { const b={id:uid(),[key]:id,batchNo:"STOCKTAKE",expiry:"",qtyReceived:diff,qtyOnHand:diff,cost:null,receivedAt:now(),by:currentUser?currentUser.name:""}; dom(k).addBatch(b); dom(k).ledgerAdd({[key]:id,batchId:b.id,type:"stocktake",qty:diff,ref:"Stock-take surplus"}); } });
  dom(k).recompute(); save(); toast(n?("Posted "+n+" adjustment(s)"):"No differences to post"); dom(k).render();
}

function dispenseFromBatchesRef(id,q,ref){ let need=Number(q)||0; onHandBatches(id).forEach(b=>{ if(need<=0)return; const take=Math.min(need,Number(b.qtyOnHand)); b.qtyOnHand-=take; need-=take; ledgerAdd({drugId:id,batchId:b.id,type:"issue",qty:-take,ref:ref||"Issued"}); }); recomputeStock(); return q-need; }

const ROLE_DEPT={doctor:"Consultation",lab:"Laboratory",pharmacy:"Pharmacy",dental:"Dental",ultrasound:"Ultrasound",xray:"X-ray",receptionist:"Reception",admin:"Administration",nurse:"Wards"};
let finTab="overview", finMonth=curYM();
function fin(){ if(!DB.finance)DB.finance={salaries:{},rent:0,utilities:0,statutory:0,other:[]}; return DB.finance; }
function paidStepsIn(ym){ const out=[]; DB.visits.forEach(v=>v.steps.forEach(s=>{ if(s.paid&&Number(s.price)>0&&(s.at||"").slice(0,7)===ym) out.push({v,s}); })); return out; }
function revenueIn(ym){ return paidStepsIn(ym).reduce((a,x)=>a+Number(x.s.price),0); }
function revByDept(ym){ const m={}; paidStepsIn(ym).forEach(({s})=>{ m[s.dept]=(m[s.dept]||0)+Number(s.price); }); return m; }
function staffCostByDept(){ const m={}; (DB.users||[]).forEach(u=>{ const sal=Number((fin().salaries||{})[u.id]||0); if(!sal)return; const d=ROLE_DEPT[u.role]||"Other"; m[d]=(m[d]||0)+sal; }); return m; }
function overheadTotal(){ const f=fin(); return Number(f.rent||0)+Number(f.utilities||0)+Number(f.statutory||0)+(f.other||[]).reduce((a,o)=>a+Number(o.amount||0),0); }
function salaryTotal(){ return Object.values(fin().salaries||{}).reduce((a,v)=>a+Number(v||0),0); }
function monthlyCost(){ return salaryTotal()+overheadTotal(); }

function renderAdminFin(){
  const tabs=[["overview","Overview"],["dept","By department"],["staff","By doctor"],["advisory","Advisory"],["costs","Costs setup"]];
  $("#v-adminfin").innerHTML=`<div class="subtabs">${tabs.map(([k,l])=>`<div class="subtab ${finTab===k?'on':''}" onclick="finTab='${k}';renderAdminFin()">${l}</div>`).join("")}</div>
    <div class="row" style="margin-bottom:14px"><label class="muted" style="font-size:12px">Month <input type="month" value="${finMonth}" onchange="finMonth=this.value;renderAdminFin()" style="width:auto;padding:6px"></label></div>
    <div id="fin-body"></div>`;
  ({overview:finOverview,dept:finByDept,staff:finByDoctor,advisory:finAdvisory,costs:finCosts})[finTab]();
}
function finOverview(){
  const rev=revenueIn(finMonth), cost=monthlyCost(), profit=rev-cost;
  // 6-month revenue trend
  const months=[]; const d=new Date(finMonth+"-01"); for(let i=5;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(m.toISOString().slice(0,7));}
  const data=months.map(ym=>({ym,rev:revenueIn(ym)})); const max=Math.max(1,...data.map(x=>x.rev),cost);
  const W=460,H=170; const bw=W/data.length;
  const bars=data.map((x,i)=>{const h=x.rev/max*(H-34);return `<g><rect x="${i*bw+10}" y="${H-22-h}" width="${bw-20}" height="${h}" rx="3" fill="#0E9F8E"></rect><text x="${i*bw+bw/2}" y="${H-7}" font-size="10" text-anchor="middle" fill="#5B7480">${x.ym.slice(2)}</text></g>`;}).join("");
  const costY=H-22-(cost/max*(H-34));
  $("#fin-body").innerHTML=`
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card stat"><div class="k">Revenue (paid services)</div><div class="v">${rev.toLocaleString()} <small>${DB.clinic.currency}</small></div></div>
    <div class="card stat"><div class="k">Running cost (monthly)</div><div class="v">${cost.toLocaleString()} <small>${DB.clinic.currency}</small></div></div>
    <div class="card stat"><div class="k">${profit>=0?"Profit":"Loss"}</div><div class="v" style="color:${profit>=0?'var(--green)':'var(--red)'}">${profit.toLocaleString()} <small>${DB.clinic.currency}</small></div></div>
  </div>
  <div class="card"><div class="card-head"><h2>Revenue trend</h2><span class="sub">last 6 months · dashed line = current monthly cost</span></div><div class="card-pad">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:560px">${bars}<line x1="6" y1="${costY}" x2="${W-6}" y2="${costY}" stroke="#D94A4A" stroke-width="1.5" stroke-dasharray="5 4"></line></svg>
    ${cost===0?`<div class="muted" style="font-size:12.5px">Enter your monthly costs under <b>Costs setup</b> to see profit and the cost line.</div>`:""}
  </div></div>
  <div class="muted" style="font-size:11.5px;margin-top:10px">Revenue is the value of <b>paid</b> services in the month (cash timing may differ). Cost is your current monthly figure — historical months use the same baseline.</div>`;
}
function finByDept(){
  const rev=revByDept(finMonth); const totalRev=Object.values(rev).reduce((a,v)=>a+v,0)||1; const scost=staffCostByDept(); const oh=overheadTotal();
  const depts=Array.from(new Set([...Object.keys(rev),...Object.keys(scost)]));
  const rows=depts.map(d=>{const r=rev[d]||0; const sc=scost[d]||0; const ohShare=Math.round(oh*(r/totalRev)); const net=r-sc-ohShare; return {d,r,sc,ohShare,net};}).sort((a,b)=>b.net-a.net);
  $("#fin-body").innerHTML=`<div class="card"><div class="card-head"><h2>Contribution by department</h2><span class="sub">${finMonth}</span></div>
  <div class="card-pad" style="padding:6px 0;overflow:auto"><table><thead><tr><th>Department</th><th class="right">Revenue</th><th class="right">Staff cost</th><th class="right">Overhead share</th><th class="right">Net</th></tr></thead><tbody>
    ${rows.length?rows.map(x=>`<tr><td><b>${esc(x.d)}</b></td><td class="right">${money(x.r)}</td><td class="right muted">${x.sc?money(x.sc):"—"}</td><td class="right muted">${money(x.ohShare)}</td><td class="right" style="font-weight:700;color:${x.net>=0?'var(--green)':'var(--red)'}">${money(x.net)}</td></tr>`).join(""):`<tr><td colspan="5" class="muted" style="padding:14px">No paid services or costs recorded for this month yet.</td></tr>`}
  </tbody></table></div>
  <div class="card-pad muted" style="font-size:12px;padding-top:0">Overhead (rent, utilities, statutory, other) is shared across departments <b>by revenue share</b> — an assumption you can revisit. Net = revenue − staff cost − overhead share.</div></div>`;
}
function finByDoctor(){
  const byDoc={}; paidStepsIn(finMonth).forEach(({v,s})=>{ let doc=(s.dept==="Consultation")?(v.clinical&&v.clinical.by):s.by; if(!doc)return; (byDoc[doc]=byDoc[doc]||{direct:0,triggered:0}); if(s.dept==="Consultation")byDoc[doc].direct+=Number(s.price); else byDoc[doc].triggered+=Number(s.price); });
  const docUsers=(DB.users||[]).filter(u=>u.role==="doctor");

  <div class="card-pad" style="padding:6px 0;overflow:auto"><table><thead><tr><th>Doctor</th><th class="right">Direct (consults)</th><th class="right">Triggered (lab/pharmacy)</th><th class="right">Total generated</th><th class="right">Salary</th><th class="right">Net</th></tr></thead><tbody>
    ${rows.length?rows.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.known?"":' <span class="pill wait">no salary set</span>'}</td><td class="right">${money(x.direct)}</td><td class="right">${money(x.triggered)}</td><td class="right" style="font-weight:700">${money(x.tot)}</td><td class="right muted">${x.sal?money(x.sal):"—"}</td><td class="right" style="font-weight:700;color:${x.net>=0?'var(--green)':'var(--red)'}">${x.sal?money(x.net):"—"}</td></tr>`).join(""):`<tr><td colspan="6" class="muted" style="padding:14px">No attributed revenue yet. Doctors generate "triggered" revenue when their prescriptions and test orders are paid.</td></tr>`}
  </tbody></table></div>
  <div class="card-pad muted" style="font-size:12px;padding-top:0"><b>How to read this:</b> "Direct" is consultation fees; "Triggered" is lab/pharmacy/imaging revenue from what the doctor ordered or prescribed. It shows contribution transparently — a doctor who enables a lot of care will show high triggered revenue even with modest consult fees. It is not a performance score; it omits clinical quality, complexity and outcomes.</div></div>`;
}
function finAdvisory(){
  const out=[]; const rev=revenueIn(finMonth), cost=monthlyCost(), profit=rev-cost;
  if(cost===0) out.push({sev:"info",t:"Enter your costs",d:"Add salaries, rent, utilities and statutory costs under Costs setup to unlock profit and contribution advice."});
  else if(profit<0) out.push({sev:"down",t:"Running at a loss this month",d:`Paid-service revenue ${money(rev)} is below the monthly running cost ${money(cost)} (shortfall ${money(-profit)}). Look at the loss-making departments below and at unpaid bills.`});
  else out.push({sev:"up",t:"In surplus this month",d:`Revenue ${money(rev)} exceeds running cost ${money(cost)} by ${money(profit)}.`});
  // unpaid receivables
  const due=DB.patients.reduce((a,p)=>a+unpaidSteps(p.id).reduce((b,x)=>b+x.s.price,0),0);
  if(due>0) out.push({sev:"margin",t:"Money owed (unpaid bills)",d:`${money(due)} of services delivered are not yet paid. Following these up converts work already done into cash.`});
  // loss-making departments
  const rbd=revByDept(finMonth); const totalRev=Object.values(rbd).reduce((a,v)=>a+v,0)||1; const scost=staffCostByDept(); const oh=overheadTotal();
  Array.from(new Set([...Object.keys(rbd),...Object.keys(scost)])).forEach(d=>{ const r=rbd[d]||0; const net=r-(scost[d]||0)-Math.round(oh*(r/totalRev)); if((scost[d]||0)>0 && net<0) out.push({sev:"down",t:`${d}: costs exceed revenue`,d:`Revenue ${money(r)} vs staff+overhead ${money((scost[d]||0)+Math.round(oh*(r/totalRev)))}. Either volume is low or pricing/staffing needs review — check the figures before acting.`}); });
  // stock value at risk (expiry) + low stock — reads pharmacy + lab
  const expVal=(DB.batches||[]).concat(DB.labBatches||[]).filter(b=>b.expiry&&Number(b.qtyOnHand)>0&&new Date(b.expiry+"-01")<=(()=>{const l=new Date();l.setMonth(l.getMonth()+3);return l;})()).reduce((a,b)=>a+(Number(b.cost||0)*Number(b.qtyOnHand)),0);
  if(expVal>0) out.push({sev:"margin",t:"Stock value at risk from expiry",d:`About ${money(Math.round(expVal))} of stock (at cost) expires within 3 months. Prioritise dispensing it or plan returns to avoid writing off cash.`});
  $("#fin-body").innerHTML=`<div class="card"><div class="card-head"><h2>Financial advisory</h2><span class="sub">${finMonth}</span></div><div class="card-pad">${out.map(advItem).join("")}</div></div>
  <div class="muted" style="font-size:11.5px;margin-top:10px">Advice is generated from your recorded services, stock and the costs you entered. It is guidance for your judgment, not an instruction, and it cannot see clinical quality or factors outside the recorded data.</div>`;
}

function renderDocAdvisory(){
  const me=currentUser?currentUser.name:"";
  const mine=DB.visits.filter(v=>v.clinical&&v.clinical.by===me);
  const out=[];
  // abnormal lab results to review
  const abn=[]; mine.forEach(v=>v.steps.forEach(s=>{ if(s.dept==="Laboratory"&&s.labResult){ const flags=s.labResult.values.filter(x=>x.flag&&x.flag!=="Normal"); if(flags.length) abn.push({v,s,flags}); } }));
  abn.slice(0,10).forEach(({v,s,flags})=>{ const p=patient(v.patientId); out.push({sev:"down",t:`Result to review — ${p?p.name:"patient"} · ${s.serviceName}`,d:flags.map(f=>f.analyte+": "+f.value+" ("+f.flag+")").join("; ")}); });
  // your antibiotic prescribing (last 30d)
  const since=Date.now()-30*86400000; let totalItems=0, abxItems=0;
  mine.forEach(v=>v.steps.forEach(s=>{ if(s.dept==="Pharmacy"&&s.prescription&&new Date(s.at).getTime()>=since){ s.prescription.forEach(i=>{ totalItems++; if(isAbx(i.drug))abxItems++; }); } }));
  if(totalItems>0) out.push({sev:abxItems/totalItems>=0.5?"margin":"info",t:"Your antibiotic prescribing",d:`Antibiotics are ${Math.round(abxItems/totalItems*100)}% of the items you prescribed in 30 days (${abxItems}/${totalItems}). A high share is worth a stewardship reflection.`});
  // interaction pairs you prescribed
  const pairs={}; mine.forEach(v=>v.steps.forEach(s=>{ if(s.dept==="Pharmacy"&&s.prescription){ const names=s.prescription.map(i=>(""+i.drug).toLowerCase()); (DB.interactions||[]).forEach(ix=>{ if(names.some(n=>n.includes(ix.a))&&names.some(n=>n.includes(ix.b))){ const k=ix.a+" + "+ix.b; (pairs[k]=pairs[k]||{c:0,sev:ix.sev,note:ix.note}); pairs[k].c++; } }); } }));
  Object.entries(pairs).slice(0,4).forEach(([k,o])=>out.push({sev:o.sev==="Major"?"down":"margin",t:`Interaction in your prescriptions — ${k}`,d:`${o.sev}: ${o.note}. Written ${o.c} time(s) — review for appropriateness.`}));
  // waiting count
  const waiting=DB.visits.filter(v=>v.status==="open").reduce((a,v)=>a+v.steps.filter(s=>s.dept==="Consultation"&&s.status==="waiting").length,0);
  if(waiting>0) out.push({sev:"info",t:"Patients waiting for consultation",d:`${waiting} in the queue now.`});
  out.push({sev:"info",t:"Note on clinical advice",d:"These are signals for your judgment, not instructions — and a missing warning is never an all-clear. Allergy, weight and renal-function data aren't captured, so allergy and dose-by-kidney checks aren't available."});
  $("#v-docadvisory").innerHTML=`<div class="card"><div class="card-head"><h2>Clinical advisory</h2><span class="sub">signals from your own patients and prescribing</span></div><div class="card-pad">${out.filter(x=>x.sev!=="info"||out.length<=2||true).map(advItem).join("")}</div></div>
  <div class="muted" style="font-size:11.5px;margin-top:10px">Based on patients where you are the recorded consulting doctor. It improves as more consultations and results are recorded.</div>`;
}

function rxAdd(){ const id=$("#rx-drug").value; if(!id)return; _rx.push({drugId:id,qty:1,directions:""}); renderRxCart(); }
function rxRemove(i){ _rx.splice(i,1); renderRxCart(); }
function rxSet(i,f,val){ _rx[i][f]= f==="qty"?(Math.max(1,Number(val)||1)):val; updateRxSummary(); }
function renderRxCart(){
  const el=$("#rx-cart"); if(!el)return;
  el.innerHTML=_rx.length?_rx.map((r,i)=>{const d=drugById(r.drugId);if(!d)return"";const over=r.qty>d.qty;return `<div style="border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:7px">

    ${over?`<div class="flag-hi" style="font-size:12px;margin-top:4px">⚠ Only ${d.qty} in stock</div>`:""}</div>`;}).join(""):`<div class="muted" style="padding:6px">No items added yet.</div>`;

function updateRxSummary(){
  let total=0; _rx.forEach(r=>{const d=drugById(r.drugId);if(d)total+=chargePrice(_rxPid,d.price,d.priceIns)*r.qty;});
  if($("#rx-total"))$("#rx-total").textContent=money(total);
  const names=_rx.map(r=>{const d=drugById(r.drugId);return d?d.name:"";});
  const ix=checkInteractions(names);
  const allergyHits=_rxPid?checkAllergyMatches(_rxPid,names):[];
  const w=$("#rx-warn"); if(!w)return;
  let html="";
  if(allergyHits.length) html+=`<div style="border:1px solid var(--red);background:var(--red-tint);border-radius:8px;padding:10px;margin-top:6px"><b style="color:var(--red)">⚠ Allergy alert</b>${allergyHits.map(x=>`<div style="font-size:12.5px;margin-top:4px">${esc(x.drug)} may relate to recorded allergy "${esc(x.allergen)}"</div>`).join("")}</div>`;
  if(ix.length) html+=`<div style="border:1px solid var(--red);background:var(--red-tint);border-radius:8px;padding:10px;margin-top:6px"><b style="color:var(--red)">⚠ Interaction check</b>${ix.map(x=>`<div style="font-size:12.5px;margin-top:4px"><span class="pill ${x.sev==='Major'?'due':'wait'}">${esc(x.sev)}</span> ${esc(x.a)} + ${esc(x.b)} — ${esc(x.note)}</div>`).join("")}</div>`;
  w.innerHTML=html;
}
function doDispense(vid,sid){
  const v=DB.visits.find(x=>x.id===vid); const s=v&&v.steps.find(x=>x.id===sid); if(!s)return;
  if(!_rx.length){ alert("Add at least one drug, or cancel."); return; }
  for(const r of _rx){ const d=drugById(r.drugId); if(d&&r.qty>d.qty && !confirm(d.name+": dispensing "+r.qty+" but only "+d.qty+" in stock. Continue?")) return; }
  let total=0; const items=[];
  _rx.forEach(r=>{ const d=drugById(r.drugId); if(!d)return; const out=dispenseFromBatches(d.id,r.qty,v.patientId); const unit=chargePrice(v.patientId,d.price,d.priceIns); const lineTotal=unit*r.qty; total+=lineTotal; items.push({drug:d.name,drugId:d.id,qty:r.qty,directions:r.directions,price:lineTotal,allocations:out.allocations}); });
  s.dispense={items,at:now(),by:currentUser?currentUser.name:""};
  s.serviceName="Medicines ("+items.length+" item"+(items.length>1?"s":"")+")";
  s.price=total; s.paid = total>0?false:true; s.status="done"; s.at=s.at||now();
  updateMedicationRefillsFromDispense(v.patientId,items);
  save(); closeModal(); renderPharmacyView();
  const patObj=patient(v.patientId);
  if(patObj&&patObj.walkin&&total>0&&!s.paid){ collectPharmacyPaymentModal(vid,sid); }
  else { toast("Dispensed · "+money(total)+" added to bill"); }
}
function voidDispense(vid,sid){
  const v=DB.visits.find(x=>x.id===vid); const s=v&&v.steps.find(x=>x.id===sid); if(!s||!s.dispense)return;
  if(s.paid){ alert("This has already been paid for. Void isn't available after payment — handle it as a refund/credit note instead."); return; }
  const reason=prompt("Reason for voiding this dispense:"); if(reason==null||!reason.trim())return;
  (s.dispense.items||[]).forEach(it=>{ if(it.allocations) restoreBatchAllocations(it.allocations); });
  s.voided=true; s.voidReason=reason.trim(); s.voidedBy=currentUser?currentUser.name:""; s.voidedAt=now();
  s.status="voided"; s.price=0; s.paid=true;
  save(); renderPharmacyView(); toast("Dispense voided — stock restored");
}

  DB.purchases.push(purchase);

/* ============= TILL / CASH-UP (pharmacy counter cash only) ============= */
const TZS_DENOMS=[10000,5000,2000,1000,500,200,100,50];
let TILLCOUNT=null;
function pharmLastTillSession(){ return (DB.tillSessions||[]).slice().sort((a,b)=>b.to.localeCompare(a.to))[0]||null; }
function pharmTillPeriodStart(){ const last=pharmLastTillSession(); return last?last.to:(todayStr()+"T00:00:00.000Z"); }
function pharmCashSalesInPeriod(from,to){ return (DB.payments||[]).filter(p=>p.origin==="Pharmacy"&&p.method==="Cash"&&p.at>=from&&p.at<=to); }
function pharmTillCashOut(from,to){ return (DB.supplierPayments||[]).filter(sp=>sp.at>=from&&sp.at<=to).reduce((a,sp)=>a+sp.amount,0); }
function renderPharmTill(){
  if(!TILLCOUNT){
    const history=(DB.tillSessions||[]).slice().sort((a,b)=>b.to.localeCompare(a.to)).slice(0,10);
    const from=pharmTillPeriodStart(), to=now();
    const cashSales=pharmCashSalesInPeriod(from,to);
    $("#ph-body").innerHTML=`
    <div class="card"><div class="card-pad" style="text-align:center;padding:36px 20px">
      <h2 style="margin-bottom:8px">End-of-shift cash-up</h2>
      <p class="muted" style="max-width:480px;margin:0 auto 10px">Count the physical cash at the pharmacy counter and compare it with what the system expects, based on cash sales${pharmLastTillSession()?" since your last cash-up":" so far today"}.</p>
      <p class="muted" style="max-width:480px;margin:0 auto 18px">Since ${pharmLastTillSession()?new Date(from).toLocaleString():"the start of today"}: <b>${cashSales.length}</b> cash sale(s) totalling <b>${money(cashSales.reduce((a,x)=>a+x.total,0))}</b>.</p>
      <button class="btn primary" onclick="startPharmTill()">+ Start cash-up now</button>
    </div></div>
    ${history.length?`<div class="card" style="margin-top:16px"><div class="card-head"><h2>Recent cash-ups</h2></div><div class="card-pad" style="padding:6px 0">
      <table><thead><tr><th>Closed</th><th>By</th><th class="right">Expected</th><th class="right">Counted</th><th class="right">Variance</th></tr></thead><tbody>
      ${history.map(h=>`<tr><td class="muted" style="font-size:12px">${new Date(h.to).toLocaleString()}</td><td>${esc(h.by||"—")}</td>
      <td class="right">${money(h.expectedClosing)}</td><td class="right">${money(h.countedClosing)}</td>
      <td class="right" style="color:${Math.abs(h.variance)<1?'inherit':h.variance<0?'var(--red)':'var(--amber)'}">${h.variance>0?"+":""}${money(h.variance)}</td></tr>`).join("")}
      </tbody></table></div></div>`:""}`;
    return;
  }
  const t=TILLCOUNT;
  $("#ph-body").innerHTML=`
  <div class="card"><div class="card-head"><h2>Cash-up in progress</h2><span class="sub">${new Date(t.from).toLocaleString()} → ${new Date(t.to).toLocaleString()}</span></div>
  <div class="card-pad">
    <div class="grid g3" style="margin-bottom:16px">
      <div class="card stat"><div class="k">Opening float</div><div class="v">${money(t.openingFloat)}</div></div>
      <div class="card stat"><div class="k">Cash sales in period</div><div class="v">${money(t.cashSalesTotal)}</div></div>
      <div class="card stat"><div class="k">Paid to suppliers (cash)</div><div class="v">${money(t.cashOut)}</div></div>
    </div>
    <div class="row" style="border-top:1px solid var(--line2);padding-top:10px;margin-bottom:14px"><b>Expected closing cash</b><span class="spacer"></span><b style="font-size:20px">${money(t.expectedClosing)}</b></div>
    <div class="card" style="background:var(--bg2);margin-bottom:14px"><div class="card-pad">
      <div style="font-weight:700;margin-bottom:8px">Optional: count by denomination (TZS)</div>
      <div class="grid g2" style="gap:8px">${TZS_DENOMS.map(d=>`<label class="fld" style="margin:0"><span class="lab">${d.toLocaleString()}</span><input type="number" min="0" class="denom-input" data-denom="${d}" value="0" oninput="tillRecalcFromDenoms()"></label>`).join("")}</div>
      <div class="muted" style="font-size:12px;margin-top:8px">Fill these in and the total below updates automatically — or skip this and just type the total.</div>
    </div></div>
    <label class="fld" style="max-width:260px"><span class="lab">Counted closing cash (total)</span><input id="till-counted" type="number" min="0" oninput="tillRecalcVariance()"></label>
    <div id="till-variance" style="margin:8px 0 14px"></div>
    <label class="fld"><span class="lab">Notes (optional)</span><input id="till-note" placeholder="e.g. reason for any shortfall"></label>
    <div class="row" style="gap:8px;margin-top:10px"><button class="btn" onclick="cancelPharmTill()">Discard</button><button class="btn primary" onclick="applyPharmTill()">Close till</button></div>
  </div></div>`;
  tillRecalcVariance();
}
function startPharmTill(){
  const from=pharmTillPeriodStart(), to=now();
  const last=pharmLastTillSession(); const openingFloat=last?last.countedClosing:0;
  const cashSales=pharmCashSalesInPeriod(from,to); const cashSalesTotal=cashSales.reduce((a,x)=>a+x.total,0);
  const cashOut=pharmTillCashOut(from,to);
  const expectedClosing=openingFloat+cashSalesTotal-cashOut;
  TILLCOUNT={from,to,openingFloat,cashSalesTotal,cashSaleCount:cashSales.length,cashOut,expectedClosing,countedClosing:null};
  renderPharmTill();
}
function tillRecalcFromDenoms(){
  let total=0; document.querySelectorAll(".denom-input").forEach(inp=>{total+=(Number(inp.value)||0)*Number(inp.dataset.denom);});
  $("#till-counted").value=total; tillRecalcVariance();
}
function tillRecalcVariance(){
  const el=$("#till-counted"); if(!el||!TILLCOUNT)return;
  const counted=Number(el.value)||0; TILLCOUNT.countedClosing=counted;
  const variance=counted-TILLCOUNT.expectedClosing;
  const out=$("#till-variance"); if(!out)return;
  out.innerHTML = variance===0?`<span class="pill paid">Exact match</span>`:`<span class="pill ${variance<0?'due':'wait'}">${variance>0?"Over":"Short"} by ${money(Math.abs(variance))}</span>`;
}
function cancelPharmTill(){ if(!confirm("Discard this cash-up? Nothing will be saved.")) return; TILLCOUNT=null; renderPharmTill(); }
function applyPharmTill(){
  const counted=Number($("#till-counted").value);
  if(isNaN(counted)||counted<0){ alert("Enter the counted cash total."); return; }
  const t=TILLCOUNT;
  const session={id:uid(),at:now(),by:currentUser?currentUser.name:"",from:t.from,to:t.to,openingFloat:t.openingFloat,cashSalesTotal:t.cashSalesTotal,cashSaleCount:t.cashSaleCount,cashOut:t.cashOut,expectedClosing:t.expectedClosing,countedClosing:counted,variance:counted-t.expectedClosing,note:$("#till-note")?$("#till-note").value.trim():""};
  DB.tillSessions.push(session); TILLCOUNT=null; save(); renderPharmTill(); toast("Till closed — variance "+money(session.variance));
}
/* ============= REPEAT MEDICATIONS / REFILL TRACKING ============= */
function refillDueDate(m){ const d=new Date((m.lastDispensed||todayStr())+"T00:00:00"); d.setDate(d.getDate()+Number(m.intervalDays||30)); return d; }
function refillStatus(m){ const days=Math.floor((refillDueDate(m)-new Date())/86400000); if(days<0)return "Overdue"; if(days<=5)return "Due soon"; return "OK"; }
function allActiveMedications(){ const out=[]; DB.patients.forEach(p=>(p.medications||[]).filter(m=>m.active).forEach(m=>out.push({patient:p,med:m,due:refillDueDate(m),status:refillStatus(m)}))); return out; }
function refillsDueSoon(){ return allActiveMedications().filter(x=>x.status!=="OK").sort((a,b)=>a.due-b.due); }
function updateMedicationRefillsFromDispense(pid,items){
  const p=patient(pid); if(!p||!p.medications||!p.medications.length)return;
  const names=new Set(items.map(i=>i.drug));
  p.medications.forEach(m=>{ if(m.active&&names.has(m.drugName)) m.lastDispensed=todayStr(); });
}

/* ============= SELF-TEST ============= */
function pharmSelfTests(){
  const results=[];
  const check=(name,pass,detail)=>results.push({name,pass:!!pass,detail:detail||""});
  check("Every batch has a non-negative quantity on hand",(DB.batches||[]).every(b=>Number(b.qtyOnHand)>=0),"negative batches: "+(DB.batches||[]).filter(b=>Number(b.qtyOnHand)<0).length);
  check("Every batch references a drug that exists",(DB.batches||[]).every(b=>DB.drugs.some(d=>d.id===b.drugId)),"orphan batches: "+(DB.batches||[]).filter(b=>!DB.drugs.some(d=>d.id===b.drugId)).length);
  check("Each drug's on-hand quantity equals the sum of its batch quantities",DB.drugs.every(d=>{const sum=(DB.batches||[]).filter(b=>b.drugId===d.id).reduce((a,b)=>a+(Number(b.qtyOnHand)||0),0);return sum===Number(d.qty);}));
  check("Every drug has a non-negative selling price",DB.drugs.every(d=>Number(d.price)>=0));
  check("Completed (non-voided) dispenses all carry at least one item",DB.visits.every(v=>v.steps.filter(s=>s.dispense&&!s.voided).every(s=>s.dispense.items&&s.dispense.items.length>0)));
  check("Every voided dispense carries a reason",DB.visits.every(v=>v.steps.filter(s=>s.voided).every(s=>!!s.voidReason)));
  check("Supplier balances are never negative",(DB.suppliers||[]).every(s=>(s.balance||0)>=0));
  check("Every purchase's balance equals total minus paid",(DB.purchases||[]).every(p=>Math.abs((p.total-p.paid)-p.balance)<=1));
  check("Every till session's variance equals counted minus expected",(DB.tillSessions||[]).every(t=>Math.abs((t.countedClosing-t.expectedClosing)-t.variance)<=1));
  check("Active repeat medications reference a drug that still exists",DB.patients.every(p=>(p.medications||[]).filter(m=>m.active).every(m=>DB.drugs.some(d=>d.id===m.drugId))));
  check("FEFO batches never carry more stock than the drug's recorded total",DB.drugs.every(d=>{const sum=onHandBatches(d.id).reduce((a,b)=>a+Number(b.qtyOnHand),0);return sum===Number(d.qty);}));
  check("Backup round-trip preserves record counts",(()=>{try{const copy=JSON.parse(JSON.stringify(DB));return copy.drugs.length===DB.drugs.length&&copy.batches.length===(DB.batches||[]).length&&copy.patients.length===DB.patients.length;}catch(e){return false;}})());
  const passCount=results.filter(r=>r.pass).length;
  $("#ph-body").innerHTML=`
  <div class="card" style="margin-bottom:16px"><div class="card-pad row"><b>${passCount}/${results.length} checks passed</b><span class="spacer"></span><button class="btn sm" onclick="pharmSelfTests()">Re-run</button></div></div>
  <div class="card"><div class="card-pad" style="padding:6px 0">
  <table><tbody>${results.map(r=>`<tr><td style="width:24px">${r.pass?'<span style="color:var(--teal-deep)">✓</span>':'<span style="color:var(--red)">✕</span>'}</td><td>${esc(r.name)}</td><td class="muted" style="font-size:12px">${esc(r.detail||"")}</td></tr>`).join("")}</tbody></table>
  </div></div>`;
}

function genScanPhysCount(dept,inputEl){

function genPhysVar(id,sys){ const el=$("#genphc-"+id); const out=$("#genphv-"+id); if(!el||!out)return; const v=el.value.trim(); if(v===""){out.textContent="—";out.className="right muted";return;} const diff=Number(v)-sys; _genPhys[id]=Number(v); out.textContent=(diff>0?"+":"")+diff; out.className="right "+(diff<0?"flag-hi":diff>0?"flag-ok":"muted"); }
function postGenStocktake(dept){
  const ids=Object.keys(_genPhys); if(!ids.length){alert("Enter at least one physical count.");return;}
  if(!DB.genLedger)DB.genLedger=[]; let n=0;
  ids.forEach(id=>{ const it=(DB.stock||[]).find(x=>x.id===id); if(!it)return; const diff=_genPhys[id]-Number(it.qty); if(diff===0)return; n++;
    it.qty=_genPhys[id];
    DB.genLedger.push({id:uid(),dept,itemId:id,type:"stocktake",qty:diff,ref:"Stock-take "+(diff<0?"shortfall":"surplus"),at:now(),by:currentUser?currentUser.name:""});
  });
  save(); toast(n?("Posted "+n+" adjustment(s)"):"No differences to post"); deptRender(dept);
}

function genImportCountModal(dept){

function handleGenImportFile(dept){
  const f=$("#genimp-file").files[0]; if(!f)return;
  $("#genimp-status").textContent="Reading file…";
  if(/\.(xlsx|xls)$/i.test(f.name)){
    loadXLSXLib().then(()=>{
      const reader=new FileReader();
      reader.onload=e=>{ try{ const wb=XLSX.read(e.target.result,{type:"array"}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}); processGenImportRows(dept,rows); }
        catch(err){ $("#genimp-status").textContent="Could not read that Excel file. Try saving it as CSV instead."; } };
      reader.readAsArrayBuffer(f);
    }).catch(()=>{ $("#genimp-status").textContent="Could not load Excel support (needs internet the first time). Please save the file as CSV and try again."; });
  } else {
    const reader=new FileReader();
    reader.onload=e=>{ processGenImportRows(dept,parseCSVText(e.target.result)); };
    reader.readAsText(f);
  }
}
function processGenImportRows(dept,rows){
  if(!rows||!rows.length){ $("#genimp-status").textContent="No rows found in that file."; return; }
  const header=rows[0].map(x=>(""+x).toLowerCase());
  let nameIdx=header.findIndex(h=>/item|name/.test(h));
  let bcIdx=header.findIndex(h=>/barcode|code/.test(h));
  let qtyIdx=header.findIndex(h=>/count|physical|qty|quantity/.test(h));
  let startRow=1;
  if(nameIdx<0&&qtyIdx<0&&bcIdx<0){ nameIdx=0; qtyIdx=1; startRow=0; }
  const items=(DB.stock||[]).filter(s=>s.dept===dept);
  const matched=[],unmatched=[];
  for(let i=startRow;i<rows.length;i++){
    const row=rows[i]; if(!row||!row.length) continue;
    const nameVal=(nameIdx>=0?(""+(row[nameIdx]??"")):"").trim();
    const bcVal=(bcIdx>=0?(""+(row[bcIdx]??"")):"").trim();
    const qtyVal=qtyIdx>=0?row[qtyIdx]:"";
    if(qtyVal===""||qtyVal==null) continue;
    const qty=Number(qtyVal); if(isNaN(qty)) continue;
    let it=null;
    if(bcVal) it=items.find(x=>x.barcode&&x.barcode.toLowerCase()===bcVal.toLowerCase());
    if(!it&&nameVal) it=items.find(x=>x.name.toLowerCase().trim()===nameVal.toLowerCase());
    if(it) matched.push({it,qty}); else unmatched.push(nameVal||bcVal||"(blank)");
  }
  _genImportRows=matched;
  $("#genimp-status").innerHTML=`<b>${matched.length}</b> item(s) matched${unmatched.length?`, <b style="color:var(--red)">${unmatched.length}</b> row(s) could not be matched`:""}.`;
  $("#genimp-preview").innerHTML=(matched.length?`<table><thead><tr><th>Item</th><th class="right">System</th><th class="right">Counted</th><th class="right">Variance</th></tr></thead><tbody>
    ${matched.map(({it,qty})=>{const diff=qty-Number(it.qty);return `<tr><td>${esc(it.name)}</td><td class="right muted">${it.qty}</td><td class="right" style="font-weight:700">${qty}</td><td class="right ${diff<0?'flag-hi':diff>0?'flag-ok':''}">${diff>0?'+':''}${diff}</td></tr>`;}).join("")}
  </tbody></table>`:"")+(unmatched.length?`<div class="muted" style="font-size:12px;margin-top:8px">Unmatched: ${unmatched.slice(0,10).map(esc).join(", ")}${unmatched.length>10?"…":""}</div>`:"");
  $("#genimp-apply").style.display=matched.length?"":"none";
}
function applyGenImportedCounts(dept){
  if(!_genImportRows||!_genImportRows.length)return;
  const rows=_genImportRows; closeModal(); deptRender(dept);
  rows.forEach(({it,qty})=>{ const el=$("#genphc-"+it.id); if(el){ el.value=qty; genPhysVar(it.id,it.qty); } });
  toast("Imported "+rows.length+" count(s) — review variances, then Post adjustments");
}

  const demo=[["receptionist","Reception Test","receptionist"],["doctor","Doctor Test","doctor"],["lab","Lab Test","lab"],["pharmacy","Pharmacy Test","pharmacy"],["dental","Dental Test","dental"],["ultrasound","Ultrasound Test","ultrasound"],["xray","Xray Test","xray"]];
  demo.forEach(([u,n,r])=>{ if(!DB.users.some(x=>x.username.toLowerCase()===u)) DB.users.push({id:uid(),username:u,name:n,role:r,passcode:u}); });
  const mkP=(name,sex)=>{ DB.seq=(DB.seq||0)+1; const p={id:uid(),regNo:"AP-"+new Date().getFullYear()+"-"+String(DB.seq).padStart(4,"0"),name,sex,createdAt:now()}; DB.patients.push(p); return p; };
  const svc=(dept,frag)=>DB.services.find(s=>s.dept===dept&&s.name.toLowerCase().includes(frag));

  DB.visits.push(vb);

function saveUser(id){
  const name=$("#u-name").value.trim(), username=$("#u-user").value.trim(), role=$("#u-role").value, passcode=$("#u-pass").value.trim();
  if(!name||!username||!passcode){ alert("Name, username and passcode are required."); return; }
  if(DB.users.some(x=>x.username.toLowerCase()===username.toLowerCase() && x.id!==id)){ alert("That username is taken."); return; }
  if(id){ Object.assign(DB.users.find(x=>x.id===id),{name,username,role,passcode}); }
  else { DB.users.push({id:uid(),name,username,role,passcode}); }
  save(); closeModal(); renderUsers(); toast("Staff saved");
}
function delUser(id){
  if(currentUser&&id===currentUser.id){ alert("You can't remove the account you're signed in with."); return; }
  const u=DB.users.find(x=>x.id===id);
  if(u&&u.role==="admin"&&DB.users.filter(x=>x.role==="admin").length<=1){ alert("Keep at least one administrator."); return; }
  if(!confirm("Remove "+(u?u.name:"this user")+"?"))return;
  DB.users=DB.users.filter(x=>x.id!==id); save(); renderUsers();
}

      if(db&&db.clinic){ DB=db; _lastSig=sigOf(db); try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){} bootUI(); }
      else { bootUI(); syncPush(); }
      startPolling();
    }).catch(function(){ bootUI(); });
  } else { bootUI(); }
})();
</script>
