function monYr(d){const x=new Date(d+"T00:00:00");return isNaN(x)?d:`${MON[x.getMonth()]} ${x.getFullYear()}`}
function pct(v,dp=1){return v==null||isNaN(v)?"–":(v*100).toFixed(dp)+"%"}
function num(v,dp=1){return v==null||isNaN(v)?"–":(+v).toFixed(dp)}

function drugName(n){n=String(n||"").trim();if(!n)return"";const lc=n.toLowerCase();if(ALIASES[lc])return ALIASES[lc];
 const hit=Object.keys(FORMULARY).find(k=>k.toLowerCase()===lc);if(hit)return hit;
 const hit2=Object.keys(FORMULARY).find(k=>k.toLowerCase().replace(/[^a-z]/g,"")===lc.replace(/[^a-z]/g,""));return hit2||n}

/* ============ Statistics ============ */
function erfc(x){const z=Math.abs(x),t=1/(1+.5*z);const r=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))));return x>=0?r:2-r}

function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const ci of c)s+=ci/++y;return -t+Math.log(2.5066282746310005*s/x)}
function gammaQ(a,x){if(x<=0)return 1;if(x<a+1){let ap=a,sum=1/a,del=sum;for(let n=0;n<300;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-12)break}return 1-sum*Math.exp(-x+a*Math.log(x)-lgamma(a))}
 let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<300;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-12)break}
 return Math.exp(-x+a*Math.log(x)-lgamma(a))*h}
function chiSq2xk(ns,ds){const N=ds.reduce((a,b)=>a+b,0),X=ns.reduce((a,b)=>a+b,0);if(!N||!X||X===N)return null;let chi=0;
 ns.forEach((n,i)=>{const e1=ds[i]*X/N,e0=ds[i]*(N-X)/N;if(e1>0)chi+=(n-e1)**2/e1;if(e0>0)chi+=(ds[i]-n-e0)**2/e0});
 const df=ns.length-1;return{chi,df,p:gammaQ(df/2,chi/2)}}
function catt(ns,ds,sc){const N=ds.reduce((a,b)=>a+b,0),X=ns.reduce((a,b)=>a+b,0);if(!N||!X||X===N)return null;const p=X/N;
 let T=0,s1=0,s2=0;ns.forEach((n,i)=>{T+=sc[i]*(n-ds[i]*p);s1+=ds[i]*sc[i]*sc[i];s2+=ds[i]*sc[i]});
 const v=p*(1-p)*(s1-s2*s2/N);if(v<=0)return null;const z=T/Math.sqrt(v);return{z,p:pNorm2(z)}}
function wilson(n,d){if(!d)return[null,null];const z=1.96,p=n/d,den=1+z*z/d,c=p+z*z/(2*d),h=z*Math.sqrt(p*(1-p)/d+z*z/(4*d*d));return[Math.max(0,(c-h)/den),Math.min(1,(c+h)/den)]}
function twoProp(n1,d1,n2,d2){if(!d1||!d2)return null;const p1=n1/d1,p2=n2/d2,p=(n1+n2)/(d1+d2);const se0=Math.sqrt(p*(1-p)*(1/d1+1/d2));
 const se=Math.sqrt(p1*(1-p1)/d1+p2*(1-p2)/d2);const diff=p2-p1;return{diff,lo:diff-1.96*se,hi:diff+1.96*se,z:se0?diff/se0:0,p:se0?pNorm2(diff/se0):1}}
function ols(xs,ys){const pts=xs.map((x,i)=>[x,ys[i]]).filter(p=>p[1]!=null);const n=pts.length;if(n<2)return null;
 const mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;let sxy=0,sxx=0,syy=0;pts.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;syy+=(y-my)**2});

function pTxt(p){return p==null?"p = –":p<.001?"p < 0.001":"p = "+p.toFixed(3)}
function fp(p){return p==null?"–":p<.001?"<0.001":p.toFixed(3)}
function yearsFrom(dates){const t0=new Date(dates[0]).getTime();return dates.map(d=>(new Date(d).getTime()-t0)/(365.25*864e5))}

/* ============ Indicators ============ */
const _cache=new Map();
function calc(s){
 const key=s.id+"|"+s.updated;if(_cache.has(key))return _cache.get(key);
 const P=s.patients,N=P.length,T=P.filter(p=>p.on==="Y"),t=T.length,rx=T.flatMap(p=>p.abs);
 const cnt=(a,f)=>a.filter(f).length,R=(n,d)=>({n,d,v:d?n/d:null});
 const sp=T.filter(p=>/^SP/.test(p.ind)),ass=T.filter(p=>p.guide==="Y"||p.guide==="N");
 const ddd=rx.reduce((a,x)=>a+abDDD(x),0);
 const out={N,t,rx:rx.length,
  prev:R(t,N),access:R(cnt(rx,a=>a.aware==="Access"),rx.length),watch:R(cnt(rx,a=>a.aware==="Watch"),rx.length),
  reserve:R(cnt(rx,a=>a.aware==="Reserve"),rx.length),nc:R(cnt(rx,a=>!["Access","Watch","Reserve"].includes(a.aware)),rx.length),
  parenteral:R(cnt(rx,a=>a.route==="P"),rx.length),reason:R(cnt(T,p=>p.reason==="Y"),t),guide:R(cnt(ass,p=>p.guide==="Y"),ass.length),
  cult:R(cnt(T,p=>p.culture==="Y"),t),stop:R(cnt(T,p=>p.stop==="Y"),t),spLong:R(cnt(sp,p=>p.ind==="SP3"),sp.length),
  combo:R(cnt(T,p=>p.abs.length>=2),t),hai:R(cnt(T,p=>p.ind==="HAI"),t),
  perPt:{v:t?rx.length/t:null},ddd100:{v:N?ddd/N*100:null},ddd};
 const by=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x)||"(blank)";m[k]=(m[k]||0)+1});return m};
 out.drugs=by(rx,a=>a.name);out.dx=by(T,p=>p.dx);out.indic=by(T,p=>p.ind);out.route=by(rx,a=>a.route);
 const W={};P.forEach(p=>{const w=W[p.ward]||(W[p.ward]={N:0,t:0,rx:0,acc:0,type:p.wardType});w.N++;if(p.on==="Y"){w.t++;p.abs.forEach(a=>{w.rx++;if(a.aware==="Access")w.acc++})}});
 out.wards=W;_cache.set(key,out);return out}

/* ============ CSV ============ */
function parseCSV(text){text=text.replace(/^﻿/,"");const rows=[];let row=[],f="",q=false;
 const sep=(text.split("\n")[0].match(/;/g)||[]).length>(text.split("\n")[0].match(/,/g)||[]).length?";":",";
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===sep){row.push(f);f=""}else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!=="\r")f+=c}
 if(f!==""||row.length){row.push(f);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()!==""))}
const HMAP={ward_name:"ward",patient_id:"patient_code",age:"age_years",gender:"sex",weight:"weight_kg",date_of_admission:"admission_date",
 on_antibiotic:"on_antimicrobial",on_am:"on_antimicrobial",diagnosis_site:"diagnosis",reason:"reason_in_notes",guideline:"guideline_compliant",
 culture:"culture_taken",stop_review:"stop_review_date",date:"survey_date",hospital:"facility"};
function csvToSurveys(text,fname){
 const rows=parseCSV(text);if(rows.length<2)throw new Error("file has no data rows");
 const h=rows[0].map(x=>{const k=x.trim().toLowerCase().replace(/[\s\-\/]+/g,"_");return HMAP[k]||k});
 if(!h.includes("ward"))throw new Error("no 'ward' column found – is this a PPS file?");
 const fromName=(fname||"").replace(/\.[^.]+$/,"");const groups={};
 rows.slice(1).forEach(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]??"").trim());
  const sid=o.survey_id||fromName.split("_")[0]||("PPS-"+today());(groups[sid]||(groups[sid]=[])).push(o)});
 return Object.entries(groups).map(([sid,list])=>{
  const date=(list.find(o=>o.survey_date)||{}).survey_date||"";
  const fac=(list.find(o=>o.facility)||{}).facility||DB.meta.facility||"";
  return{id:sid,date:normDate(date)||today(),facility:fac,source:fname||"",imported:new Date().toISOString(),updated:Date.now(),patients:list.map(rowToPatient)}})}
function normDate(d){if(!d)return"";if(/^\d{4}-\d{2}-\d{2}/.test(d))return d.slice(0,10);const m=d.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
 if(m)return`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;const x=new Date(d);return isNaN(x)?d:x.toISOString().slice(0,10)}
function rowToPatient(o){const abs=[];
 for(let i=1;i<=6;i++){const n=drugName(o[`ab${i}_name`]);if(!n)continue;const f=FORMULARY[n]||{};
  let rt=String(o[`ab${i}_route`]||f.route||"").trim().toUpperCase();rt=rt.startsWith("I")||rt==="P"?"P":rt.startsWith("O")||rt==="PO"?"O":rt;
  abs.push({name:n,atc:o[`ab${i}_atc`]||f.atc||"",aware:normAware(o[`ab${i}_aware`])||f.aware||"Not classified",route:rt,dose:parseFloat(o[`ab${i}_dose_mg`])||null,freq:parseFloat(o[`ab${i}_doses_per_day`])||null})}
 let on=YN(o.on_antimicrobial);if(!on)on=abs.length?"Y":"N";
 return{code:o.patient_code||"",ward:o.ward||"",wardCode:o.ward_code||"",wardType:(o.ward_type||"").toUpperCase(),age:o.age_years===""?null:parseFloat(o.age_years),
  sex:(o.sex||"").toUpperCase().slice(0,1),weight:o.weight_kg===""||o.weight_kg==null?null:parseFloat(o.weight_kg),adm:normDate(o.admission_date||""),on,
  dx:(o.diagnosis||"").toUpperCase(),ind:(o.indication||"").toUpperCase(),reason:YN(o.reason_in_notes),guide:YN(o.guideline_compliant),culture:YN(o.culture_taken),
  stop:YN(o.stop_review_date),surgery:YN(o.surgery_last_30d),line:YN(o.catheter_or_line),abs}}
function normAware(v){v=String(v||"").trim().toLowerCase();if(!v)return"";if(v.startsWith("acc"))return"Access";if(v.startsWith("wat"))return"Watch";if(v.startsWith("res"))return"Reserve";return"Not classified"}
function csvCell(v){v=v==null?"":String(v);return/[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function surveyToCSV(s){const lines=[HEAD.join(",")];s.patients.forEach(p=>{const o={survey_id:s.id,survey_date:s.date,facility:s.facility,ward:p.ward,ward_code:p.wardCode,ward_type:p.wardType,
 patient_code:p.code,age_years:p.age??"",sex:p.sex,weight_kg:p.weight??"",admission_date:p.adm,on_antimicrobial:p.on,diagnosis:p.dx,indication:p.ind,reason_in_notes:p.reason,
 guideline_compliant:p.guide,culture_taken:p.culture,stop_review_date:p.stop,surgery_last_30d:p.surgery,catheter_or_line:p.line};
 p.abs.slice(0,4).forEach((a,i)=>{const j=i+1;Object.assign(o,{[`ab${j}_name`]:a.name,[`ab${j}_atc`]:a.atc,[`ab${j}_aware`]:a.aware,[`ab${j}_route`]:a.route,[`ab${j}_dose_mg`]:a.dose??"",[`ab${j}_doses_per_day`]:a.freq??""})});
 lines.push(HEAD.map(k=>csvCell(o[k])).join(","))});return lines.join("\r\n")}

/* ============ IndexedDB ============ */
const IDB={db:null,
 open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open("odieman_pps_pro",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
 async get(k){const db=await this.open();return new Promise(res=>{const r=db.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)})},
 async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
 async del(k){const db=await this.open();return new Promise(res=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").delete(k);tx.oncomplete=res})}};

/* ============ Data folder (File System Access) ============ */
const FS={handle:null,state:"none",lastSave:null,supported:"showDirectoryPicker" in window,
 async restore(){if(!this.supported){this.state="unsupported";return}
  try{const h=await IDB.get("dirHandle");if(!h)return;this.handle=h;
   const p=await h.queryPermission({mode:"readwrite"});this.state=p==="granted"?"connected":"needs-permission"}catch(e){this.state="none"}},
 async connect(){if(DEMO){toast("Demo version: request the full PPS Pro to save your own data in a folder.");return}if(!this.supported){toast("This browser cannot open folders. Please use Chrome or Microsoft Edge.");return}
  try{const h=await showDirectoryPicker({id:"odieman-pps",mode:"readwrite",startIn:"documents"});await this.attach(h)}catch(e){if(e.name!=="AbortError")toast("Folder not opened: "+e.message)}},
 async attach(h){this.handle=h;try{await IDB.set("dirHandle",h)}catch(e){}this.state="connected";log(`Data folder opened: ${h.name}`);await onFolderReady()},
 async reconnect(){try{const p=await this.handle.requestPermission({mode:"readwrite"});if(p==="granted"){this.state="connected";log("Folder access restored");await onFolderReady()}}catch(e){toast("Could not reconnect: "+e.message)}},
 async forget(){await IDB.del("dirHandle");this.handle=null;this.state="none";log("Data folder disconnected");pill();render()},
 async dir(path,create=true){let d=this.handle;for(const p of path.split("/").filter(Boolean))d=await d.getDirectoryHandle(p,{create});return d},
 async write(path,data){const parts=path.split("/"),fn=parts.pop(),d=await this.dir(parts.join("/"));const fh=await d.getFileHandle(fn,{create:true});const w=await fh.createWritable();await w.write(data);await w.close()},
 async read(path){try{const parts=path.split("/"),fn=parts.pop(),d=await this.dir(parts.join("/"),false);return await (await (await d.getFileHandle(fn)).getFile()).text()}catch(e){return null}},
 async list(path=""){const out=[];try{const d=path?await this.dir(path,false):this.handle;for await(const [name,h] of d.entries())out.push({name,kind:h.kind,h})}catch(e){}return out},
 async remove(path){try{const parts=path.split("/"),fn=parts.pop(),d=await this.dir(parts.join("/"),false);await d.removeEntry(fn)}catch(e){}}};
const DATAFILE="odieman_pps_data.json";

async function onFolderReady(){
 pill();
 const txt=await FS.read(DATAFILE);let added=0;
 if(txt){try{const fdb=JSON.parse(txt);mergeDB(fdb);log(`Loaded ${DATAFILE} (${fdb.surveys.length} surveys)`)}catch(e){toast("Saved data file in folder could not be read; a backup copy is kept in /backups")}}
 added=await scanFolder(true);
 DB.surveys.forEach(s=>dirty.add(s.id));
 await FS.write("README.txt",readmeText()).catch(()=>{});
 await saveNow();
 if(!UI.sid&&DB.surveys.length)UI.sid=sorted().at(-1).id;
 render();toast(`Data folder “${FS.handle.name}” connected${added?` · ${added} survey file(s) imported`:""}. Changes now save automatically.`)}
function mergeDB(fdb){if(!fdb||!Array.isArray(fdb.surveys))return;
 DB.meta=Object.assign({},fdb.meta||{},DB.meta.facility?{facility:DB.meta.facility}:{},{ignored:[...new Set([...(fdb.meta?.ignored||[]),...(DB.meta.ignored||[])])]});
 if(!DB.meta.author)DB.meta.author="Odindo Emmanuel Thomas";
 fdb.surveys.forEach(fs=>{const cur=getS(fs.id);if(!cur)DB.surveys.push(fs);else if((fs.updated||0)>(cur.updated||0))Object.assign(cur,fs)})}
async function scanFolder(quiet){if(FS.state!=="connected")return 0;let added=0;
 const files=[...(await FS.list("")).map(f=>({...f,path:f.name})),...(await FS.list("surveys")).map(f=>({...f,path:"surveys/"+f.name}))];
 for(const f of files){if(f.kind!=="file"||!/\.csv$/i.test(f.name))continue;if(DB.meta.ignored?.includes(f.path))continue;
  try{const text=await (await f.h.getFile()).text();const ss=csvToSurveys(text,f.name);
   for(const s of ss){if(getS(s.id))continue;s.source=f.path;DB.surveys.push(s);dirty.add(s.id);added++;log(`Imported ${s.id} from ${f.path} (${s.patients.length} patients)`)}}
  catch(e){log(`Skipped ${f.path}: ${e.message}`)}}
 if(added&&!quiet){toast(`${added} new survey file(s) found in the data folder and imported`);await saveNow();render()}
 return added}

/* ============ Saving ============ */
let saveTimer=null,saving=false;
function touch(sid){if(DEMO){const s0=getS(sid);if(s0)s0.updated=Date.now();DB.meta.updated=new Date().toISOString();return}const s=getS(sid);if(s){s.updated=Date.now();dirty.add(sid)}DB.meta.updated=new Date().toISOString();clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,700);pill("saving")}
async function saveNow(){if(DEMO)return;if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500);return}saving=true;
 try{DB.meta.updated=DB.meta.updated||new Date().toISOString();await IDB.set("db",DB).catch(()=>{});
  if(FS.state==="connected"){const json=JSON.stringify(DB);
   await FS.write(DATAFILE,json);
   for(const id of dirty){const s=getS(id);if(s)await FS.write(`surveys/${s.id}.csv`,surveyToCSV(s))}
   await FS.write(`backups/odieman_pps_${today()}.json`,json);await pruneBackups();
   FS.lastSave=new Date();log(`Saved ${DATAFILE}${dirty.size?` + ${dirty.size} survey CSV(s)`:""}`);dirty.clear()}
 }catch(e){log("Save failed: "+e.message);toast("Could not save to the data folder: "+e.message);if(/permission|NotAllowed/i.test(e.name+e.message))FS.state="needs-permission"}
 saving=false;pill()}
async function pruneBackups(){const keep=+DB.meta.keepBackups||30;const b=(await FS.list("backups")).filter(f=>/^odieman_pps_\d{4}-\d{2}-\d{2}\.json$/.test(f.name)).map(f=>f.name).sort();
 for(const n of b.slice(0,Math.max(0,b.length-keep)))await FS.remove("backups/"+n)}

 if(FS.state==="connected"){try{await FS.write("reports/"+name,blob);toast(`Saved to data folder › reports › ${name}`);log(`Report saved: reports/${name}`);return}catch(e){}}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ============ Charts (SVG) ============ */
const F='font-family="Segoe UI,Roboto,Arial,sans-serif"';
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),m=v/e;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*e}

async function svgToPng(svg,name){const xml=new XMLSerializer().serializeToString(svg);const vb=svg.viewBox.baseVal;const sc=2.5;

function heatColor(v,lo,hi,good){if(v==null)return"#f4f6f6";let t=(v-lo)/((hi-lo)||1);t=Math.max(0,Math.min(1,t));if(good==="up")t=1-t;

function dqCheck(s){const out=[];const seen=new Set();
 s.patients.forEach(p=>{const id=p.code||"(no code)";const add=(lvl,msg)=>out.push({s:s.id,id,lvl,msg});
  if(!p.ward)add("Error","Ward missing");if(p.code&&seen.has(p.code))add("Error","Duplicate patient code");seen.add(p.code);
  if(p.age==null||isNaN(p.age))add("Warning","Age missing");else if(p.age<0||p.age>110)add("Error",`Implausible age ${p.age}`);
  if(p.adm&&s.date&&p.adm>s.date)add("Error","Admission date after survey date");
  if(p.on==="Y"&&!p.abs.length)add("Error","Marked on antimicrobial but no agent recorded");
  if(p.on==="N"&&p.abs.length)add("Error","Marked not on antimicrobial but agents recorded");
  if(p.on==="Y"){if(!p.ind)add("Warning","Indication missing");if(!p.dx)add("Warning","Diagnosis missing");
   if(p.ind==="HAI"&&p.adm&&(new Date(s.date)-new Date(p.adm))/864e5<2)add("Warning","HAI but admitted <48 h before survey");
   if(/^SP/.test(p.ind)&&p.surgery==="N")add("Warning","Surgical prophylaxis without recorded surgery");
   p.abs.forEach(a=>{if(!FORMULARY[a.name])add("Warning",`“${a.name}” not in formulary (AWaRe set to ${a.aware})`);if(!a.dose)add("Info",`${a.name}: dose missing`);if(!a.route)add("Warning",`${a.name}: route missing`)});

 return out}

 <div class="card section" id="g1"><h3>1. Getting started</h3><ol>
  <li><b>Keep the tool and its data together:</b> <code>Odieman_PPS_Pro.html</code> next to a data folder such as <code>PPS_Data</code>.</li>
  <li>Open the tool in <b>Google Chrome or Microsoft Edge</b> and click <b>Open data folder</b> (top right). Choose the data folder and allow “View and edit”. ${open("folder","Data folder")}</li>
  <li>Any PPS CSV files in that folder are imported automatically, one survey per file. From then on everything saves into the folder by itself.</li>
  <li>Start with <b>Overview</b> and <b>Trends</b>; open <b>Survey dashboard</b> for the detail of one survey. ${open("overview","Overview")} ${open("trends","Trends")}</li>
  <li>For a new survey, either enter it on <b>Data entry</b> or drop its CSV file into the data folder and return to the tool. ${open("entry","Data entry")}</li>
  <li>Check <b>Data quality</b> before reporting, then produce the <b>Trend report</b> (print to PDF or save as HTML). ${open("report","Trend report")}</li></ol></div>

 <div class="card section" id="g2"><h3>2. Running a survey on the wards (WHO method in brief)</h3><ul>
  <li><b>Who is included:</b> every patient admitted to the ward at 08:00 on the survey day. Patients admitted after 08:00 and day cases are not included. Each ward is surveyed once, on a single day.</li>
  <li><b>One form per ward</b> (ward name and type, number of eligible patients) and <b>one form per patient</b> (age, sex, weight for children, admission date, whether on an antimicrobial).</li>
  <li><b>For each patient on an antimicrobial,</b> record up to four agents with dose, doses per day and route; the diagnosis (site of infection), indication, whether the reason is written in the notes, whether the choice follows the guideline, whether a culture was taken and whether a stop/review date is documented.</li>
  <li>Use the chart, treatment sheet and notes — not the patient's memory. Record what is prescribed on the survey day.</li>
  <li>Repeat at the same time of year where possible, with the same wards and the same method, so surveys can be compared.</li></ul></div>

 <div class="card section" id="g3"><h3>3. Data format and codes</h3>
  <p>One CSV file per survey, one row per inpatient. Required: <span class="mono">ward</span> and either <span class="mono">on_antimicrobial</span> or the antimicrobial names. ATC code and AWaRe group are filled in automatically when left blank; common brand names (Augmentin, Septrin, Flagyl, X-pen …) are recognised. ${open("settings","Settings (blank template)")}</p>
  <div class="tablewrap"><table><tr><th>Field</th><th>Codes</th></tr>
  <tr><td>indication</td><td>${Object.entries(INDN).map(([k,v])=>`<b>${k}</b> ${v}`).join(" · ")}</td></tr>
  <tr><td>diagnosis</td><td>${Object.entries(DX).map(([k,v])=>`<b>${k}</b> ${v}`).join(" · ")}</td></tr>
  <tr><td>route</td><td><b>P</b> parenteral (IV/IM) · <b>O</b> oral</td></tr>
  <tr><td>Yes/No fields</td><td><b>Y</b> / <b>N</b>; guideline compliance also <b>NA</b> when it cannot be assessed (e.g. no local guideline for that indication)</td></tr>
  <tr><td>ward_type</td><td>MED, SUR, OBG, PED, NEO, ICU, MIX</td></tr></table></div></div>

 <div class="card section" id="g5"><h3>5. Practise with the sample data</h3>
  <p>The <b>PPS_Data</b> folder that comes with the tool holds five simulated surveys of the fictional “Demo Regional Referral Hospital” (March 2024, October 2024, May 2025, December 2025 and July 2026; about 250 inpatients each, nine wards). It is <b>not real patient data</b>. The same hospital and wards appear in the AMS Pro and VigiWard samples.</p>
  <div class="note">Built to show a stewardship programme taking effect: prevalence falling (68% → 45%), Access share rising (42% → 70%, past the earlier WHO 60% target and almost at the UN 2030 goal of 70%), more cultures, more stop/review dates and reasons documented, surgical prophylaxis beyond one day falling (82% → 30%) — while parenteral use barely changes, a realistic “next target”. Trends and Statistics show which changes are statistically significant.</div></div>

 <div class="card section" id="g6"><h3>6. Saving and moving computers</h3><ul>
  <li>With the data folder open, the database (<code>odieman_pps_data.json</code>), one CSV per survey (<code>surveys/</code>) and a daily backup (<code>backups/</code>) are written automatically; charts and reports you save go to <code>reports/</code>.</li>
  <li>After restarting the browser, click the yellow <b>Reconnect</b> pill once.</li>
  <li>To move computers, copy the HTML file and the data folder together, then open the folder from the tool.</li>
  <li>Without Chrome/Edge, data is kept in the browser only — use <i>Download full backup</i> on the Data folder page regularly.</li></ul></div>

 <div class="card section" id="g7"><h3>7. Reading the statistics</h3><ul>
  <li><b>95% CI (Wilson):</b> the range the true value probably lies in. Overlapping intervals between two surveys mean the difference may be chance.</li>
  <li><b>Cochran–Armitage test for trend:</b> tests whether a proportion rises or falls steadily across surveys (spacing by time in years). p &lt; 0.05 = unlikely to be chance.</li>
  <li><b>Chi-square test:</b> whether the surveys differ at all, without assuming a direction.</li>
  <li><b>First vs latest:</b> the difference in percentage points with its 95% CI.</li>
  <li><b>Change per year:</b> a straight-line summary; with only a few surveys treat it as descriptive.</li>
  <li>Indicators are proportions of different denominators: prevalence is per inpatient, AWaRe and route per prescription, quality indicators per treated patient, surgical prophylaxis per patient on prophylaxis.</li></ul></div>

 <div class="card section" id="g8"><h3>8. Troubleshooting</h3><div class="tablewrap"><table><tr><th>What you see</th><th>What to do</th></tr>
  <tr><td>“No 'ward' column found”</td><td>The CSV needs a header row with a <span class="mono">ward</span> column. Download the blank template from Settings.</td></tr>
  <tr><td>A survey was not imported from the folder</td><td>A survey with the same survey_id already exists, or the file was deleted earlier (deleted files are not re-imported). Change the survey_id or import from Surveys.</td></tr>
  <tr><td>Drug shows “Not classified”</td><td>The name was not recognised — use the generic name. Data quality lists these.</td></tr>
  <tr><td>Pill says “Click to reconnect”</td><td>Normal after a browser restart — click it and allow access.</td></tr>
  <tr><td>Folder button missing or red pill</td><td>Use Google Chrome or Microsoft Edge.</td></tr></table></div></div>

 <div class="card section" id="g9"><h3>9. Glossary</h3><div class="tablewrap"><table>
  <tr><td><b>PPS</b></td><td>Point prevalence survey — a snapshot of everyone on the ward on one day.</td></tr>
  <tr><td><b>Prevalence of antimicrobial use</b></td><td>Inpatients on at least one antimicrobial ÷ all inpatients surveyed.</td></tr>
  <tr><td><b>AWaRe</b></td><td>WHO Access / Watch / Reserve classification. UN 2024 political declaration on AMR: at least 70% of human antibiotic use from Access by 2030 (the earlier WHO target was 60%).</td></tr>
  <tr><td><b>CAI / HAI</b></td><td>Community- / hospital-acquired infection (HAI: symptoms starting 48 h or more after admission).</td></tr>
  <tr><td><b>SP1 / SP2 / SP3</b></td><td>Surgical prophylaxis: single dose / one day / more than one day.</td></tr>
  <tr><td><b>DDD</b></td><td>WHO defined daily dose; here shown per 100 inpatients on the survey day.</td></tr>
  <tr><td><b>ATC</b></td><td>WHO Anatomical Therapeutic Chemical code of a medicine.</td></tr></table></div></div>
 </div>`}

/* ============ Actions ============ */
async function importFiles(files){let n=0;for(const f of files){try{const text=await f.text();
  if(/\.json$/i.test(f.name)){const d=JSON.parse(text);const before=DB.surveys.length;mergeDB(d);n+=DB.surveys.length-before;DB.surveys.forEach(s=>dirty.add(s.id));continue}
  for(const s of csvToSurveys(text,f.name)){const cur=getS(s.id);
   if(cur){ /* same survey from another surveyor (e.g. different wards on the same day): merge, or replace */
    const codes=new Set(cur.patients.map(p=>p.code).filter(Boolean));const dup=s.patients.filter(p=>p.code&&codes.has(p.code)).length;
    if(confirm(`Survey ${s.id} already exists (${cur.patients.length} patients).\n\nOK = MERGE: add the ${s.patients.length} patients from ${f.name} — e.g. another surveyor's wards${dup?`\n   (${dup} patient code(s) appear in both files and will be listed on Data quality as duplicates)`:""}\nCancel = more options`)){
     cur.patients=cur.patients.concat(s.patients);cur.source=[cur.source,f.name].filter(Boolean).join(" + ");dirty.add(cur.id);n++;UI.sid=cur.id;log(`Merged ${s.patients.length} patients from ${f.name} into ${cur.id}`);
     if(FS.state==="connected")await FS.write(f.name,text).catch(()=>{});continue}
    if(!confirm(`Replace survey ${s.id} entirely with the data in ${f.name}? (Cancel = skip this file)`))continue}
   DB.surveys=DB.surveys.filter(x=>x.id!==s.id);DB.surveys.push(s);dirty.add(s.id);n++;UI.sid=s.id;log(`Imported ${s.id} from ${f.name} (${s.patients.length} patients)`);
   if(FS.state==="connected")await FS.write(f.name,text).catch(()=>{})}}
 catch(e){toast(`${f.name}: ${e.message}`)}}
 if(n){touch();toast(`${n} survey(s) imported`+(FS.state==="connected"?" and saved to the data folder":""));if(UI.page==="overview"&&DB.surveys.length===n)UI.page="trends";render()}}
function newSurvey(){const d=prompt("Survey date (YYYY-MM-DD)",today());if(!d)return;const nd=normDate(d);let id=prompt("Survey ID",`PPS-${nd.slice(0,7)}`);if(!id)return;id=id.trim();
 if(getS(id))return toast("A survey with that ID already exists");DB.surveys.push({id,date:nd,facility:DB.meta.facility||sorted().at(-1)?.facility||"",source:"",imported:new Date().toISOString(),updated:Date.now(),patients:[]});
 UI.sid=id;UI.page="entry";touch(id);render()}
function readPatient(){const g=id=>document.getElementById(id).value.trim();const s=getS(UI.sid);
 const abs=[0,1,2,3].map(i=>{const n=drugName(g(`a${i}_name`));if(!n)return null;const f=FORMULARY[n]||{};return{name:n,atc:f.atc||"",aware:f.aware||"Not classified",route:g(`a${i}_route`)||f.route||"",dose:parseFloat(g(`a${i}_dose`))||null,freq:parseFloat(g(`a${i}_freq`))||null}}).filter(Boolean);
 let on=g("e_on")||"N";if(abs.length)on="Y";
 const ward=g("e_ward");if(!ward){toast("Ward is required");return null}
 const code=g("e_code")||`${s.id.replace(/\D/g,"")}-${(ward.match(/\b\w/g)||[]).join("").toUpperCase().slice(0,3)}-${String(s.patients.length+1).padStart(3,"0")}`;
 return{code,ward,wardCode:"",wardType:g("e_wardType"),age:g("e_age")===""?null:+g("e_age"),sex:g("e_sex"),weight:g("e_weight")===""?null:+g("e_weight"),adm:g("e_adm"),on,
  dx:on==="Y"?g("e_dx"):"",ind:on==="Y"?g("e_ind"):"",reason:on==="Y"?g("e_reason"):"",guide:on==="Y"?g("e_guide"):"",culture:on==="Y"?g("e_culture"):"",stop:on==="Y"?g("e_stop"):"",surgery:g("e_surgery"),line:g("e_line"),abs}}
function download(name,text,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click()}
function summaryCSV(){const S=sorted(),C=S.map(calc);const rows=[["indicator",...S.map(s=>s.id),"trend_p"]];INDS.forEach(m=>{const t=trendTest(m.k);rows.push([m.label,...C.map(c=>c[m.k].v==null?"":(m.pct?(c[m.k].v*100).toFixed(1):c[m.k].v.toFixed(m.dp??1))),t?fp(t.p):""])});return rows.map(r=>r.map(csvCell).join(",")).join("\r\n")}
function reportStandalone(){const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
 return`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="author" content="${esc(DB.meta.author||"")}"><title>PPS Trend Report</title><style>${css}</style></head><body style="background:#fff;padding:24px">${reportHTML()}</body></html>`}

function bindView(){const v=$("#view");
 v.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>go(b.dataset.goto));
 v.querySelectorAll("[data-scroll]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll).scrollIntoView({behavior:"smooth"}));
 v.querySelectorAll("#selSurvey").forEach(el=>el.onchange=()=>{UI.sid=el.value;UI.editIdx=null;render()});
 const ss=$("#selStat");if(ss)ss.onchange=()=>{UI.stat=ss.value;render()};
 ["cmpA","cmpB"].forEach(k=>{const el=document.getElementById(k);if(el)el.onchange=()=>{UI[k]=el.value;render()}});
 const dq=$("#selDQ");if(dq)dq.onchange=()=>{UI.dqSid=dq.value;render()};
 const ps=$("#patSearch");if(ps)ps.oninput=()=>{$("#patTable").innerHTML=patTable(getS(UI.sid),ps.value);bindView()};
 v.querySelectorAll("[data-ab]").forEach(el=>el.onchange=()=>{const i=el.dataset.ab,n=drugName(el.value),f=FORMULARY[n];el.value=n;
  document.getElementById(`a${i}_atc`).value=f?.atc||"";document.getElementById(`a${i}_aware`).value=f?.aware||(n?"Not classified":"");
  const r=document.getElementById(`a${i}_route`);if(f&&!r.value)r.value=f.route;if(n)document.getElementById("e_on").value="Y"});
 v.querySelectorAll("[data-png]").forEach(b=>b.onclick=()=>svgToPng(b.closest(".card").querySelector("svg"),b.dataset.png));
 v.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{UI.sid=b.dataset.open;go("dash")});
 v.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{UI.sid=b.dataset.edit;UI.editIdx=null;go("entry")});
 v.querySelectorAll("[data-exp]").forEach(b=>b.onclick=()=>{const s=getS(b.dataset.exp);saveOut(`${s.id}.csv`,surveyToCSV(s),"text/csv")});
 v.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const s=getS(b.dataset.del);if(!confirm(`Delete survey ${s.id} (${s.patients.length} patients)? A copy stays in today's backup.`))return;
  DB.surveys=DB.surveys.filter(x=>x.id!==s.id);if(s.source){DB.meta.ignored=[...new Set([...(DB.meta.ignored||[]),s.source])]}
  if(FS.state==="connected"){await FS.remove(`surveys/${s.id}.csv`);DB.meta.ignored=[...new Set([...(DB.meta.ignored||[]),`surveys/${s.id}.csv`])]}log(`Deleted survey ${s.id}`);touch();render()});
 v.querySelectorAll("[data-pedit]").forEach(b=>b.onclick=()=>{UI.editIdx=+b.dataset.pedit;render();window.scrollTo(0,0)});
 v.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{const s=getS(UI.sid),i=+b.dataset.pdel;if(!confirm(`Remove patient ${s.patients[i].code}?`))return;s.patients.splice(i,1);UI.editIdx=null;touch(s.id);render()});
 v.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act))}
async function act(a){switch(a){
 case"folder":return FS.connect();case"reconnect":return FS.reconnect();case"forget":if(confirm("Stop saving to this folder? Files already there are kept."))FS.forget();return;
 case"import":return $("#fileIn").click();case"rescan":{const n=await scanFolder(false);if(!n)toast("No new survey files found in the folder");return}
 case"savenow":DB.surveys.forEach(s=>dirty.add(s.id));await saveNow();toast("Saved");render();return;
 case"template":return download("PPS_template.csv",HEAD.join(",")+"\r\n","text/csv");
 case"newsurvey":return newSurvey();
 case"savepat":{const p=readPatient();if(!p)return;const s=getS(UI.sid);if(UI.editIdx!=null)s.patients[UI.editIdx]=p;else s.patients.push(p);toast(UI.editIdx!=null?"Patient updated":`Patient ${p.code} added`);UI.editIdx=null;touch(s.id);render();return}
 case"cancelpat":UI.editIdx=null;render();return;
 case"print":return window.print();
 case"savereport":return saveOut(`PPS_trend_report_${today()}.html`,reportStandalone(),"text/html");
 case"savesummary":return saveOut(`PPS_indicators_${today()}.csv`,summaryCSV(),"text/csv");
 case"backup":return saveOut(`odieman_pps_backup_${today()}.json`,JSON.stringify(DB),"application/json");
 case"restore":{const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>importFiles(i.files);i.click();return}
 case"savesettings":DB.meta.facility=$("#set_fac").value.trim();DB.meta.author=$("#set_author").value.trim();DB.meta.keepBackups=Math.max(3,+$("#set_keep").value||30);touch();toast("Settings saved");return}}

$("#btnImport").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=e=>{importFiles([...e.target.files]);e.target.value=""};
$("#btnFolder").onclick=()=>FS.state==="needs-permission"?FS.reconnect():FS.connect();
$("#folderPill").onclick=()=>FS.state==="needs-permission"?FS.reconnect():go("folder");
$("#nav").onclick=e=>{const a=e.target.closest("[data-page]");if(a){UI.editIdx=null;go(a.dataset.page)}};
document.addEventListener("dragover",e=>{e.preventDefault();document.body.classList.add("drop")});
document.addEventListener("dragleave",e=>{if(!e.relatedTarget)document.body.classList.remove("drop")});
document.addEventListener("drop",e=>{e.preventDefault();document.body.classList.remove("drop");importFiles([...e.dataTransfer.files])});
let lastScan=0;window.addEventListener("focus",()=>{if(FS.state==="connected"&&Date.now()-lastScan>4000){lastScan=Date.now();scanFolder(false)}});
document.getElementById("drugList").innerHTML=Object.keys(FORMULARY).map(n=>`<option value="${n}">`).join("");
async function runDemo(){
 const bar=document.createElement("div");bar.className="warnbox noprint";bar.style.cssText="margin:12px 0 0";
 bar.innerHTML='<b>Live demo.</b> Five simulated surveys of a fictional hospital (2024–2026) are loaded in your browser. Nothing you do here is saved or sent anywhere. <a href="../index.html#download" target="_top">Request the full version</a> to use PPS Pro with your own data.';
 $("main").insertBefore(bar,$("#view"));pill();
 try{const base="../samples/pps/";const list=await (await fetch(base+"manifest.json")).json();
  for(const n of list){const t=await (await fetch(base+n)).text();csvToSurveys(t,n).forEach(x=>{x.source=n;DB.surveys.push(x)})}
  DB.meta.facility="Demo Regional Referral Hospital";{const want=new URLSearchParams(location.search).get("view");UI.page=want&&PAGES.some(([,it])=>it.some(([k])=>k===want))?want:"overview"}UI.sid=sorted().at(-1).id;render();toast(DB.surveys.length+" sample surveys loaded")}
 catch(e){$("#view").innerHTML=`<div class="warnbox">The sample data could not be loaded (${esc(e.message)}). The live demo works when opened from the website; offline, open the PPS_Data folder that comes with the download instead.</div>`}}
if(DEMO){runDemo()}else (async()=>{try{const d=await IDB.get("db");if(d&&Array.isArray(d.surveys))DB=Object.assign(DB,d,{meta:Object.assign(DB.meta,d.meta||{})})}catch(e){}
 await FS.restore();if(!DB.surveys.length&&FS.state!=="connected"&&FS.state!=="needs-permission")UI.page="guide";pill();render();if(FS.state==="connected")await onFolderReady()})();
